<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family:Archivo,Helvetica,Arial,sans-serif;width:100%;min-width:0;background:#F7F9FB;border-radius:12px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px">
  <span style="display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:999px;background:#FFFFFF;color:#5B8FBC">
    <dc-import name="Ikony" iconName="{{ icon }}" size="28" hint-size="28px,28px"></dc-import>
  </span>
  <h2 style="margin:0;font-family:'Archivo Narrow',Archivo,sans-serif;font-weight:700;font-size:24px;color:#1C2229">{{ title }}</h2>
  <p style="margin:0;max-width:56ch;font-size:15px;color:#3D4750;line-height:1.55">{{ text }}</p>
  <sc-if value="{{ hasSuggestions }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px">
      <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="3">
        <dc-import name="Chip" label="{{ s.label }}" href="{{ s.href }}" variant="outline" size="small" hint-size="120px,32px"></dc-import>
      </sc-for>
    </div>
  </sc-if>
  <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px">
    <dc-import name="Tlacitko" label="{{ primaryLabel }}" variant="primary" onClick="{{ onPrimary }}" hint-size="160px,44px"></dc-import>
    <sc-if value="{{ hasSecondary }}" hint-placeholder-val="{{ true }}">
      <dc-import name="Tlacitko" label="{{ secondaryLabel }}" variant="text" href="{{ secondaryHref }}" hint-size="160px,24px"></dc-import>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:360},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Žádné produkty tomuto výběru neodpovídají&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;search&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Smazat filtry&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Průvodce výběrem&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;suggestions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;onPrimary&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const suggestions = (p.suggestions || ['Matrace 180 × 200', 'Taštičkové matrace', 'Postele z masivu'])
      .map(s => (typeof s === 'string' ? { label: s, href: '#' } : s));
    return {
      icon: p.icon || 'search',
      title: p.title || 'Žádné produkty tomuto výběru neodpovídají',
      text: p.text || 'Zkuste uvolnit některý z filtrů nebo rozšířit cenové rozpětí. Rádi vám poradíme i telefonicky na +420 543 212 855.',
      hasSuggestions: suggestions.length > 0,
      suggestions,
      primaryLabel: p.primaryLabel || 'Smazat filtry',
      onPrimary: () => { if (p.onPrimary) p.onPrimary(); },
      hasSecondary: p.secondaryLabel !== null,
      secondaryLabel: p.secondaryLabel || 'Průvodce výběrem',
      secondaryHref: p.secondaryHref || '#pruvodce'
    };
  }
}
</script>
</body>
</html>

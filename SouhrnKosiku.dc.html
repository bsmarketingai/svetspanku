<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
</style>
</helmet>
<section aria-label="Souhrn košíku" style="{{ boxStyle }}">
  <sc-if value="{{ hasDiscount }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--ss-border-subtle,#E1E6EB)">
      <span style="font-size:15px;color:var(--ss-text-secondary,#3D4750)">Sleva z kupónu</span>
      <span style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:18px;white-space:nowrap;color:var(--ss-status-success,#157A41)">{{ discount }}</span>
    </div>
  </sc-if>
  <sc-if value="{{ termsNote }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Checkbox" parts="{{ termsParts }}" checked="{{ termsChecked }}" onChange="{{ onTerms }}" hint-size="100%,44px"></dc-import>
  </sc-if>
  <div style="display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
      <span style="font-size:16px;font-weight:600">{{ totalLabel }}</span>
      <span style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:32px;line-height:1.1;white-space:nowrap">{{ total }}</span>
    </div>
    <span style="align-self:flex-end;font-size:14px;color:var(--ss-text-muted,#5B6874);white-space:nowrap">{{ totalNoVat }} bez DPH</span>
  </div>
  <dc-import name="Tlacitko" label="{{ ctaLabel }}" sublabel="{{ ctaSublabel }}" variant="buy" size="large" href="{{ ctaHref }}" iconRight="chevron-right" fullWidth="{{ true }}" hint-size="100%,52px"></dc-import>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:240},&quot;total&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;47 570 Kč&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;totalNoVat&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;39 314 Kč&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;discount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flush&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;totalLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Celkem za zboží&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;termsChecked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onTerms&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(checked: boolean) =&gt; void&quot;},&quot;termsNote&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ctaSublabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pokračovat v objednávce&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#doprava&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const flush = !!p.flush;
    return {
      total: p.total ?? '47 570 Kč',
      totalNoVat: p.totalNoVat ?? '39 314 Kč',
      hasDiscount: !!p.discount, discount: p.discount,
      ctaHref: p.ctaHref || '#doprava',
      ctaLabel: p.ctaLabel || 'Pokračovat v objednávce',
      totalLabel: p.totalLabel || 'Celkem za zboží',
      termsNote: !!p.termsNote,
      termsChecked: !!p.termsChecked,
      onTerms: (v) => { if (p.onTerms) p.onTerms(v); },
      termsParts: [{ text: 'Souhlasím s ' }, { text: 'obchodními podmínkami', href: '#obchodni-podminky' }, { text: ' a beru na vědomí ' }, { text: 'zásady ochrany osobních údajů', href: '#ochrana-osobnich-udaju' }, { text: '.' }], ctaSublabel: p.ctaSublabel || '',
      boxStyle: { fontFamily: 'Roboto,Helvetica,Arial,sans-serif', color: 'var(--ss-text-primary,#1C2229)', boxSizing: 'border-box', width: '100%', display: 'flex', flexDirection: 'column', gap: '24px', padding: flush ? '24px 16px' : '32px', borderRadius: flush ? 0 : '12px', background: flush ? 'var(--ss-surface-hover,#F0F5FA)' : 'var(--ss-surface-page,#FFFFFF)', boxShadow: flush ? 'none' : '0 4px 12px rgba(19,44,67,.12)' }
    };
  }
}
</script>
</body>
</html>

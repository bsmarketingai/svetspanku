<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

.ss-mob,.ss-mob *{box-sizing:border-box;}
.ss-mob{font-family:Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100%;width:100%;background:var(--ss-surface-page,#FEFAF7);min-width:0;overflow-x:hidden;}
.ss-mob-row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 16px;margin:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ss-text-primary,#1C2229);text-align:left;text-decoration:none;cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-mob-row:active{background:var(--ss-surface-muted,#F3EDE4);}
.ss-mob-row:focus-visible{outline:none;box-shadow:inset 0 0 0 3px rgba(41,96,147,.35);}
.ss-mob-icon{display:flex;color:var(--ss-text-muted,#55616C);flex:none;}
</style>
</helmet>
<div class="ss-mob">
  <div style="display:flex;align-items:center;gap:8px;min-height:56px;padding:0 8px 0 16px;border-bottom:1px solid var(--ss-border-subtle,#E1E6EB);flex:none">
    <span style="font-family:Oswald,Roboto,sans-serif;font-weight:700;font-size:19px">Menu</span>
    <button type="button" class="ss-mob-row" style="width:44px;height:44px;min-height:44px;padding:0;margin-left:auto;justify-content:center;border-radius:6px" onClick="{{ close }}" aria-label="Zavřít menu">
      <span class="ss-mob-icon"><dc-import name="Ikony" iconName="x" size="22" hint-size="22px,22px"></dc-import></span>
    </button>
  </div>

  <div style="flex:1;overflow:hidden;min-height:0">
    <div style="height:100%">
      <div style="height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch">
        <nav aria-label="Hlavní kategorie" style="display:flex;flex-direction:column;padding:8px 0">
          <sc-for list="{{ categories }}" as="c" hint-placeholder-count="8">
            <sc-if value="{{ c.hasChildren }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;align-items:stretch">
                <a class="ss-mob-row" href="{{ c.href }}" style="{{ c.linkStyle }}">{{ c.label }}</a>
                <button type="button" class="ss-mob-row" onClick="{{ c.onOpen }}" style="flex:1;width:auto;min-width:48px;justify-content:flex-end" aria-expanded="{{ c.expanded }}" aria-controls="{{ c.panelId }}" aria-label="{{ c.toggleLabel }}">
                  <span class="ss-mob-icon"><dc-import name="Ikony" iconName="{{ c.chevron }}" size="20" hint-size="20px,20px"></dc-import></span>
                </button>
              </div>
              <sc-if value="{{ c.isOpen }}" hint-placeholder-val="{{ false }}">
                <div id="{{ c.panelId }}" style="display:flex;flex-direction:column;padding:4px 0 12px;background:var(--ss-surface-subtle,#FAF5EF)">
                  <sc-for list="{{ c.groups }}" as="g" hint-placeholder-count="2">
                    <div style="{{ g.style }}">
                      <sc-if value="{{ g.isList }}" hint-placeholder-val="{{ true }}">
                        <h3 style="margin:0;padding:12px 0 4px;font-size:15px;line-height:1.3;color:var(--ss-text-secondary,#3D4750)"><a href="{{ g.href }}" style="color:inherit;text-decoration:none">{{ g.title }}</a></h3>
                        <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="4">
                          <a class="ss-mob-row" href="{{ i.href }}" style="padding:0;min-height:36px;font-size:14px">
                            <span style="flex:1;min-width:0">{{ i.label }}</span>
                            <span style="font-size:13px;color:var(--ss-text-muted,#5B6874)">{{ i.count }}</span>
                          </a>
                        </sc-for>
                      </sc-if>
                      <sc-if value="{{ g.isLeaf }}" hint-placeholder-val="{{ false }}">
                        <a class="ss-mob-row" href="{{ g.href }}" style="padding:0;min-height:44px;font-size:15px;font-weight:600">{{ g.title }}</a>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
            </sc-if>
            <sc-if value="{{ c.isLeaf }}" hint-placeholder-val="{{ false }}">
              <a class="ss-mob-row" href="{{ c.href }}" style="{{ c.style }}">{{ c.label }}</a>
            </sc-if>
          </sc-for>
        </nav>
          <button type="button" class="ss-mob-row" style="color:var(--ss-text-secondary,#3D4750)" onClick="{{ toggleStores }}" aria-expanded="{{ storesExpanded }}">
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="map-pin" size="20" hint-size="20px,20px"></dc-import></span>
            <span style="flex:1;min-width:0">Prodejny (5)</span>
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="{{ storesChevron }}" size="20" hint-size="20px,20px"></dc-import></span>
          </button>
          <sc-if value="{{ storesOpen }}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 0 8px">
              <dc-import name="ProdejnyMenu" compact="{{ true }}" hint-size="100%,420px"></dc-import>
            </div>
          </sc-if>
        <div style="border-top:1px solid var(--ss-border-subtle,#E1E6EB);padding:8px 0 24px;display:flex;flex-direction:column">
          <sc-for list="{{ utility }}" as="u" hint-placeholder-count="4">
            <a class="ss-mob-row" href="{{ u.href }}" style="color:var(--ss-text-secondary,#3D4750)">{{ u.label }}</a>
          </sc-for>
          <a class="ss-mob-row" href="#prihlaseni" style="color:var(--ss-text-secondary,#3D4750)">
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="user" size="20" hint-size="20px,20px"></dc-import></span>
            <span>Přihlášení a registrace</span>
          </a>
          <a class="ss-mob-row" href="#oblibene" style="color:var(--ss-text-secondary,#3D4750)">
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="heart" size="20" hint-size="20px,20px"></dc-import></span>
            <span>Oblíbené</span>
          </a>
          <a class="ss-mob-row" href="#porovnani" style="color:var(--ss-text-secondary,#3D4750)">
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="arrows-diff" size="20" hint-size="20px,20px"></dc-import></span>
            <span>Porovnání</span>
          </a>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:700},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;categories&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;MenuCategory[]&quot;},&quot;utility&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label: string, href: string}[]&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { openIndex: -1, cats: null };
  componentDidMount() {
    if (!this.props.categories) import('./menu.js').then(m => this.setState({ cats: m.MENU, util: m.UTILITY }));
  }
  componentDidUpdate(prev) {
    if (prev.open && !this.props.open && this.state.openIndex !== -1) this.setState({ openIndex: -1 });
  }
  renderVals() {
    const p = this.props;
    const cats = p.categories || this.state.cats || [];
    const utility = p.utility || this.state.util || [];
    const oi = this.state.openIndex;
    return {
      categories: cats.map((c, i) => ({
        label: c.label,
        href: c.href || '#',
        hasChildren: !!(c.groups && c.groups.length),
        isLeaf: !(c.groups && c.groups.length),
        style: c.highlight ? { color: 'var(--ss-status-error,#B3261E)', fontWeight: 600 } : { fontWeight: 500 },
        linkStyle: Object.assign({ width: 'auto', flex: '0 1 auto', paddingRight: '8px' }, c.highlight ? { color: 'var(--ss-status-error,#B3261E)', fontWeight: 600 } : { fontWeight: 500 }),
        toggleLabel: (oi === i ? 'Sbalit ' : 'Rozbalit ') + c.label,
        isOpen: oi === i,
        expanded: oi === i ? 'true' : 'false',
        chevron: oi === i ? 'chevron-up' : 'chevron-down',
        panelId: 'ss-mob-p' + i,
        groups: (c.groups || []).map((g, gi) => ({ title: g.title, href: g.href || c.href || '#', items: g.items || [], isLeaf: !(g.items && g.items.length), isList: !!(g.items && g.items.length), style: { display: 'flex', flexDirection: 'column', margin: '0 16px 0 32px', borderTop: gi === 0 ? '0' : '1px solid var(--ss-border-subtle,#E1E6EB)', paddingTop: gi === 0 ? 0 : '4px' } })),
        onOpen: () => this.setState(s => ({ openIndex: s.openIndex === i ? -1 : i }))
      })),
      utility,
      storesOpen: !!this.state.storesOpen,
      storesExpanded: this.state.storesOpen ? 'true' : 'false',
      storesChevron: this.state.storesOpen ? 'chevron-up' : 'chevron-down',
      toggleStores: () => this.setState(s => ({ storesOpen: !s.storesOpen })),
      close: () => { if (p.onClose) p.onClose(); }
    };
  }
}
</script>
</body>
</html>

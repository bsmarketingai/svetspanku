<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
</helmet>
<section style="width:100%;min-width:0;font-family:Roboto,Helvetica,Arial,sans-serif">
  <sc-if value="{{ hasHeading }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:24px">
      <h2 style="margin:0;font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:{{ headingSize }};line-height:1.15;color:var(--ss-text-heading,#0B1F33)">{{ heading }}</h2>
      <sc-if value="{{ hasSubheading }}" hint-placeholder-val="{{ false }}">
        <p style="margin:0;font-size:15px;color:var(--ss-text-muted,#5B6874)">{{ subheading }}</p>
      </sc-if>
    </div>
  </sc-if>

  <div style="display:grid;grid-template-columns:{{ gridTemplate }};gap:{{ gap }}">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="6">
      <dc-import name="KategorickaDlazdice" label="{{ i.label }}" href="{{ i.href }}" count="{{ i.count }}" sub="{{ i.sub }}" image="{{ i.image }}" zoom="{{ i.zoom }}" variant="{{ i.variant }}" hint-size="100%,240px"></dc-import>
    </sc-for>
  </div>

  <sc-if value="{{ hasPopular }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px">
      <span style="font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ss-text-muted,#55616C);margin-right:4px">Nejhledanější</span>
      <sc-for list="{{ popular }}" as="c" hint-placeholder-count="4">
        <dc-import name="Chip" label="{{ c.label }}" href="{{ c.href }}" variant="outline" size="small" hint-size="120px,32px"></dc-import>
      </sc-for>
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:420},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nejoblíbenější kategorie&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subheading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vše pro zdravý spánek&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;kompaktni&quot;,&quot;vystup&quot;,&quot;horizontalni&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Category[]&quot;},&quot;popular&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440, items: null };
  componentDidMount() {
    this._resize = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._resize);
    if (!this.props.items) import('./produkty.js').then(m => this.setState({ items: m.KATEGORIE.map(({ sub, count, ...k }) => k) }));
  }
  componentWillUnmount() { window.removeEventListener('resize', this._resize); }
  renderVals() {
    const p = this.props;
    const w = this.state.width;
    const compact = p.variant === 'kompaktni';
    const horiz = p.variant === 'horizontalni';
    const items = (p.items || this.state.items || []).map(i => horiz ? Object.assign({}, i, { variant: 'horizontalni' }) : Object.assign({ variant: compact ? 'kompaktni' : p.variant === 'vystup' ? 'vystup' : 'standard' }, i));
    const cols = horiz ? (w >= 1000 ? 3 : w >= 550 ? 2 : 1) : compact
      ? (w >= 1150 ? 4 : w >= 820 ? 3 : 2)
      : (w >= 1560 ? 6 : w >= 820 ? 3 : 2);
    const popular = (p.popular || []).map(l => (typeof l === 'string' ? { label: l, href: '#' } : l));
    return {
      items,
      hasHeading: !!p.heading,
      heading: p.heading,
      headingSize: w < 820 ? '26px' : '34px',
      hasSubheading: !!p.subheading,
      subheading: p.subheading,
      gridTemplate: 'repeat(' + cols + ',minmax(0,1fr))',
      gap: compact || w < 550 ? '12px' : '20px',
      hasPopular: popular.length > 0,
      popular
    };
  }
}
</script>
</body>
</html>

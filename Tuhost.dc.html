<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;}
.ss-th-help{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;padding:0;border:0;border-radius:999px;background:none;color:var(--ss-text-muted,#5B6874);cursor:pointer;transition:color .12s cubic-bezier(.22,.61,.36,1),background-color .12s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-th-help:hover{color:var(--ss-hover-text,#21507B);background:var(--ss-hover-bg,#F0F5FA);}}
.ss-th-help:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
</style>
</helmet>
<sc-if value="{{ isCompact }}" hint-placeholder-val="{{ true }}">
  <span style="display:inline-flex;align-items:center;gap:4px;min-width:0">
  <span role="meter" aria-valuemin="1" aria-valuemax="5" aria-valuenow="{{ value }}" aria-valuetext="{{ valueText }}" aria-label="{{ ariaLabel }}" style="display:inline-flex;align-items:center;gap:8px;font-family:Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.35;color:var(--ss-text-secondary,#3D4750);min-width:0">
    <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="font-weight:500">{{ label }}</span></sc-if>
    <span aria-hidden="true" style="display:grid;grid-template-columns:repeat(5,14px);gap:2px;flex:none">
      <sc-for list="{{ segs }}" as="s" hint-placeholder-count="5">
        <span style="display:block;height:6px;border-radius:999px;background:{{ s.bg }};box-shadow:{{ s.ring }}"></span>
      </sc-for>
    </span>
    <span style="font-weight:700;color:var(--ss-text-primary,#1C2229);white-space:nowrap">{{ numText }}</span>
  </span>
  <sc-if value="{{ hasHelp }}" hint-placeholder-val="{{ true }}">
    <button type="button" class="ss-th-help" onClick="{{ openHelp }}" aria-haspopup="dialog" aria-label="Co znamenají stupně tuhosti?"><dc-import name="Ikony" iconName="help-circle" size="18" hint-size="18px,18px"></dc-import></button>
  </sc-if>
  </span>
</sc-if>
<sc-if value="{{ isLarge }}" hint-placeholder-val="{{ false }}">
  <div role="meter" aria-valuemin="1" aria-valuemax="5" aria-valuenow="{{ value }}" aria-valuetext="{{ valueText }}" aria-label="{{ ariaLabel }}" style="display:flex;flex-direction:column;gap:8px;width:100%;font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-secondary,#3D4750)">
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px">
      <span style="display:inline-flex;align-items:center;gap:4px">
        <span style="font-size:15px;font-weight:600;color:var(--ss-text-primary,#1C2229)">{{ label }}</span>
        <sc-if value="{{ hasHelp }}" hint-placeholder-val="{{ true }}">
          <button type="button" class="ss-th-help" onClick="{{ openHelp }}" aria-haspopup="dialog" aria-label="Co znamenají stupně tuhosti?"><dc-import name="Ikony" iconName="help-circle" size="18" hint-size="18px,18px"></dc-import></button>
        </sc-if>
      </span>
      <span style="display:flex;align-items:baseline;gap:8px;font-size:14px">
        <span style="font-family:Oswald,Roboto,sans-serif;font-weight:700;font-size:20px;line-height:1;color:var(--ss-text-heading,#0B1F33)">{{ numText }}</span>
        <span>· {{ word }}</span>
      </span>
    </div>
    <span aria-hidden="true" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px">
      <sc-for list="{{ segs }}" as="s" hint-placeholder-count="5">
        <span style="display:block;height:10px;border-radius:999px;background:{{ s.bg }};box-shadow:{{ s.ring }}"></span>
      </sc-for>
    </span>
    <span aria-hidden="true" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:13px;color:var(--ss-text-muted,#5B6874)">
      <sc-for list="{{ segs }}" as="s" hint-placeholder-count="5">
        <span style="text-align:center;font-weight:{{ s.numWeight }};color:{{ s.numColor }}">{{ s.n }}</span>
      </sc-for>
    </span>
    <span aria-hidden="true" style="display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ss-text-muted,#5B6874)">
      <span>Měkká</span>
      <span>Tvrdá</span>
    </span>
  </div>
</sc-if>
<sc-if value="{{ isScale }}" hint-placeholder-val="{{ false }}">
  <div role="meter" aria-valuemin="1" aria-valuemax="5" aria-valuenow="{{ value }}" aria-valuetext="{{ valueText }}" aria-label="{{ ariaLabel }}" style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;font-family:Roboto,Helvetica,Arial,sans-serif">
    <div style="display:flex;align-items:center;justify-content:center;gap:4px;text-align:center">
      <span style="font-weight:600;font-size:15px;line-height:1.3;color:var(--ss-text-heading,#0B1F33)">{{ wordCap }}</span>
      <span style="font-size:14px;color:var(--ss-text-muted,#5B6874)">({{ numText }})</span>
      <sc-if value="{{ hasHelp }}" hint-placeholder-val="{{ true }}">
        <button type="button" class="ss-th-help" onClick="{{ openHelp }}" aria-haspopup="dialog" aria-label="Co znamenají stupně tuhosti?"><dc-import name="Ikony" iconName="help-circle" size="18" hint-size="18px,18px"></dc-import></button>
      </sc-if>
    </div>
    <span aria-hidden="true" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px">
      <sc-for list="{{ segs }}" as="s" hint-placeholder-count="5">
        <span style="display:block;height:10px;border-radius:999px;background:{{ s.bg }};box-shadow:{{ s.ring }}"></span>
      </sc-for>
    </span>
    <span aria-hidden="true" style="display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ss-text-muted,#5B6874)">
      <span>Měkká</span>
      <span>Tvrdá</span>
    </span>
  </div>
</sc-if>
<dc-import name="TuhostModal" open="{{ helpOpen }}" value="{{ value }}" onClose="{{ closeHelp }}" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:160},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4.5,&quot;min&quot;:1,&quot;max&quot;:5,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;compact&quot;,&quot;large&quot;,&quot;scale&quot;],&quot;default&quot;:&quot;compact&quot;,&quot;tsType&quot;:&quot;'compact' | 'large' | 'scale'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tuhost&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;napoveda&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  static SHADES = ['#B9D0E5', '#8DB3D3', '#296093', '#21507B', '#132C43'];
  static WORDS = { 1: 'velmi měkká', 1.5: 'velmi měkká až měkká', 2: 'měkká', 2.5: 'měkká až středně tuhá', 3: 'středně tuhá', 3.5: 'středně tuhá až tvrdá', 4: 'tvrdá', 4.5: 'tvrdá až velmi tvrdá', 5: 'velmi tvrdá' };
  state = { help: false };
  renderVals() {
    const p = this.props;
    const raw = Number(p.value ?? 4.5);
    const v = Math.min(5, Math.max(1, Math.round((isNaN(raw) ? 3 : raw) * 2) / 2));
    const track = 'var(--ss-surface-card,#FFFFFF)';
    const ring = 'inset 0 0 0 1px #8DB3D3';
    const segs = [1, 2, 3, 4, 5].map((n, i) => {
      const f = Math.max(0, Math.min(1, v - i));
      const c = Component.SHADES[i];
      const bg = f >= 1 ? c : f <= 0 ? track : 'linear-gradient(90deg,' + c + ' 0 50%,' + track + ' 50% 100%)';
      const cur = Math.ceil(v) === n;
      return { n: 'H' + n, bg, ring: f >= 1 ? 'none' : ring, numWeight: cur ? '700' : '400', numColor: cur ? 'var(--ss-text-heading,#0B1F33)' : 'var(--ss-text-muted,#5B6874)' };
    });
    const numText = 'H' + String(v).replace('.', ',');
    const word = Component.WORDS[v] || '';
    const size = p.size === 'large' ? 'large' : p.size === 'scale' ? 'scale' : 'compact';
    const marks = [1, 2, 3, 4, 5].map(n => { const on = n === v || n === Math.floor(v) || n === Math.ceil(v); return { h: on ? '24px' : '14px', bg: on ? '#21507B' : '#B9D0E5' }; });
    return {
      isCompact: size === 'compact', isLarge: size === 'large', isScale: size === 'scale',
      marks, wordCap: word.charAt(0).toUpperCase() + word.slice(1),
      label: p.label ?? 'Tuhost',
      hasLabel: (p.label ?? 'Tuhost') !== '',
      ariaLabel: p.label || 'Tuhost',
      value: v, numText, word, segs,
      valueText: numText + ' z H5, ' + word,
      hasHelp: p.napoveda ?? true,
      helpOpen: this.state.help,
      openHelp: (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } this.setState({ help: true }); },
      closeHelp: () => this.setState({ help: false })
    };
  }
}
</script>
</body>
</html>

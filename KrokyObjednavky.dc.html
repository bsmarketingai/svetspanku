<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
.ss-step{position:relative;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:color .12s cubic-bezier(.22,.61,.36,1);}
.ss-step::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:transparent;transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
a.ss-step{color:var(--ss-text-secondary,#3D4750);}
@media (hover:hover) and (pointer:fine){a.ss-step:hover,a.ss-step:hover span{color:var(--ss-hover-text,#21507B)!important;}a.ss-step:hover::after{background:#FBB255;}}
a.ss-step:focus-visible{outline:none;box-shadow:inset 0 0 0 3px rgba(41,96,147,.35);border-radius:6px;}
.ss-step[aria-current="step"]::after{background:#FBB255;}
</style>
</helmet>
<nav aria-label="Kroky objednávky" style="width:100%;background:var(--ss-surface-muted,#F3EDE4);border-bottom:1px solid var(--ss-border-subtle,#E1E6EB);font-family:Roboto,Helvetica,Arial,sans-serif">
  <ol style="{{ olStyle }}">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
      <li style="{{ s.liStyle }}">
        <sc-if value="{{ s.sep }}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="display:flex;flex:none;align-self:center;color:var(--ss-text-muted,#5B6874)"><dc-import name="Ikony" iconName="chevron-right" size="20" hint-size="20px,20px"></dc-import></span>
        </sc-if>
        <sc-if value="{{ s.isLink }}" hint-placeholder-val="{{ false }}">
          <a class="ss-step" href="{{ s.href }}" style="{{ s.itemStyle }}">
            <span style="{{ s.checkStyle }}"><dc-import name="Ikony" iconName="check" size="{{ s.checkSize }}" strokeWidth="3" hint-size="28px,28px"></dc-import><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Hotovo: krok {{ s.num }}</span></span>
            <span style="{{ s.labelStyle }}">{{ s.label }}</span>
          </a>
        </sc-if>
        <sc-if value="{{ s.isText }}" hint-placeholder-val="{{ true }}">
          <span class="ss-step" aria-current="{{ s.current }}" style="{{ s.itemStyle }}">
            <span style="{{ s.numStyle }}">{{ s.num }}</span>
            <span style="{{ s.labelStyle }}">{{ s.label }}</span>
          </span>
        </sc-if>
      </li>
    </sc-for>
  </ol>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:1,&quot;options&quot;:[1,2,3],&quot;tsType&quot;:&quot;1 | 2 | 3&quot;},&quot;href1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;KosikKrok1.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;KosikKrok2.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#dodaci-udaje&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440 };
  componentDidMount() {
    this._r = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const p = this.props;
    const active = Number(p.active ?? 1);
    const narrow = this.state.width < 820;
    const allLabels = this.state.width >= 550;
    const defs = [
      { label: 'Váš košík', href: p.href1 || 'KosikKrok1.dc.html' },
      { label: 'Doprava, montáž a platba', href: p.href2 || 'KosikKrok2.dc.html' },
      { label: 'Dodací údaje', href: p.href3 || 'KosikKrok3.dc.html' }
    ];
    return {
      olStyle: { listStyle: 'none', margin: '0 auto', padding: narrow ? '0 8px' : '0 32px', maxWidth: '1560px', boxSizing: 'border-box', display: 'flex', justifyContent: narrow ? 'space-between' : 'center', alignItems: 'stretch', gap: narrow ? '4px' : '24px' },
      steps: defs.map((d, i) => {
        const n = i + 1, isActive = n === active, done = n < active;
        const showLabel = !narrow || allLabels || isActive;
        const color = isActive ? 'var(--ss-text-primary,#1C2229)' : done ? 'var(--ss-status-success,#157A41)' : 'var(--ss-text-muted,#5B6874)';
        return {
          num: n + '.', label: d.label, href: d.href, sep: i > 0,
          isLink: done, isText: !done,
          current: isActive ? 'step' : undefined,
          liStyle: { display: 'flex', alignItems: 'stretch', gap: narrow ? '4px' : '24px', flex: narrow ? (showLabel ? '1 1 auto' : '0 0 auto') : 'none', minWidth: 0 },
          itemStyle: {
            flexDirection: 'row', justifyContent: 'center', gap: narrow ? '8px' : '12px', width: (narrow && showLabel) ? '100%' : undefined,
            padding: narrow ? '8px 12px' : '24px 16px', minHeight: narrow ? '56px' : '80px', textAlign: 'center', color
          },
          checkSize: narrow ? 24 : 28,
          checkStyle: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: narrow ? '22px' : '32px', color: 'var(--ss-status-success,#157A41)' },
          numStyle: { fontFamily: "Oswald,Roboto,sans-serif", fontWeight: 700, fontSize: narrow ? '22px' : '32px', lineHeight: 1, color: isActive ? 'var(--ss-link,#296093)' : (done ? 'var(--ss-status-success,#157A41)' : 'inherit') },
          labelStyle: !showLabel ? { position: 'absolute', width: '1px', height: '1px', padding: 0, margin: '-1px', overflow: 'hidden', clip: 'rect(0 0 0 0)', whiteSpace: 'nowrap', border: 0 } : { textAlign: narrow ? 'left' : undefined, fontSize: narrow ? '15px' : '16px', fontWeight: isActive ? 700 : 600, lineHeight: narrow ? 1.2 : 1.25, textWrap: 'balance' }
        };
      })
    };
  }
}
</script>
</body>
</html>

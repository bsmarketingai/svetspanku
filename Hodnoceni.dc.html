<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
</helmet>
<span style="{{ wrapStyle }}">
  <span style="display:inline-flex;align-items:center;gap:2px;color:{{ starColor }}" aria-hidden="true">
    <sc-for list="{{ stars }}" as="s" hint-placeholder-count="5">
      <dc-import name="Ikony" iconName="{{ s.icon }}" size="{{ s.size }}" hint-size="16px,16px"></dc-import>
    </sc-for>
  </span>
  <span style="{{ valueStyle }}">{{ valueText }}</span>
  <sc-if value="{{ hasCount }}" hint-placeholder-val="{{ true }}">
    <span style="{{ countStyle }}">{{ countText }}</span>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:64},&quot;value&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4.6,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:128,&quot;min&quot;:0,&quot;max&quot;:9999,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;small&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;hvezdy&quot;,&quot;options&quot;:[&quot;hvezdy&quot;,&quot;kompakt&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const value = Math.max(0, Math.min(5, Number(p.value ?? 4.6)));
    const small = p.size === 'small';
    const iconSize = small ? 14 : 16;
    const kompakt = p.variant === 'kompakt';
    const stars = [];
    if (kompakt) {
      stars.push({ size: iconSize, icon: 'star-filled' });
    } else {
      for (let i = 1; i <= 5; i++) {
        const diff = value - i + 1;
        stars.push({ size: iconSize, icon: diff >= 0.75 ? 'star-filled' : (diff >= 0.25 ? 'star-half-filled' : 'star') });
      }
    }
    const count = p.count;
    return {
      stars,
      starColor: kompakt ? '#55616C' : '#F09A2C',
      valueText: value.toFixed(1).replace('.', ','),
      countText: count ? '(' + String(count).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + (kompakt ? '×)' : ' hodnocení)') : '',
      hasCount: !!count,
      wrapStyle: {
        fontFamily: 'Roboto, Helvetica, Arial, sans-serif',
        display: 'inline-flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap'
      },
      valueStyle: { fontSize: (small ? 13 : 14) + 'px', fontWeight: 600, color: 'var(--ss-text-primary,#1C2229)' },
      countStyle: { fontSize: '13px', color: 'var(--ss-text-muted,#5B6874)' }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
html,body{margin:0!important;padding:0!important;}
#dc-root{margin:0!important;padding:0!important;width:100%!important;max-width:none!important;border:0!important;}
#dc-root>.sc-host{margin:0!important;padding:0!important;width:100%!important;}
a{color:var(--ss-link,#296093);}
a:hover{color:var(--ss-hover-text,#21507B);}
.ss-k3-ta{box-sizing:border-box;width:100%;min-height:112px;padding:12px 14px;border:0;border-radius:6px;font-family:Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ss-text-primary,#1C2229);background:var(--ss-surface-page,#FEFAF7);box-shadow:inset 0 0 0 1px var(--ss-border-subtle,#E1E6EB);resize:vertical;transition:box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.ss-k3-ta:hover{box-shadow:inset 0 0 0 1px var(--ss-border-strong,#C8D0D8);}
.ss-k3-ta:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35),inset 0 0 0 1px var(--ss-border-action,#296093);}
@media (max-width:549px){.ss-k3-ta{font-size:16px;}}
</style>
</helmet>
<div style="width:100%;background:var(--ss-surface-page,#FEFAF7);font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1C2229)">
  <dc-import name="Hlavicka" style="position:sticky;top:0;z-index:200" ledMode="{{ ledMode }}" hint-size="100%,180px"></dc-import>
  <dc-import name="PrezentacniLista" items="{{ presItems }}" onToggle="{{ onPresToggle }}" hint-size="320px,52px"></dc-import>

  <main>
    <dc-import name="KrokyObjednavky" active="{{ 3 }}" hint-size="100%,80px"></dc-import>
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Dodací údaje</h1>

    <section style="width:100%">
      <div style="{{ inner }}">
        <div style="display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }};align-items:start">
          <div style="display:flex;flex-direction:column;gap:40px;min-width:0;max-width:640px">

            <dc-import name="SocialniPrihlaseni" hint-size="100%,140px"></dc-import>

            <section aria-labelledby="ss-k3-dodaci" style="display:flex;flex-direction:column;gap:20px">
              <h2 id="ss-k3-dodaci" style="margin:0;font-size:{{ h2Size }};line-height:1.2">Dodací údaje</h2>
              <dc-import name="Input" label="Jméno a příjmení" required="{{ true }}" autoComplete="name" bordered="{{ true }}" value="{{ f.name }}" onChange="{{ on.name }}" hint-size="100%,70px"></dc-import>
              <dc-import name="Input" label="E-mail" type="email" required="{{ true }}" autoComplete="email" bordered="{{ true }}" value="{{ f.email }}" onChange="{{ on.email }}" hint-size="100%,70px"></dc-import>
              <div role="group" aria-labelledby="ss-k3-tel" style="display:flex;flex-direction:column;gap:6px">
                <span id="ss-k3-tel" style="font-size:13px;font-weight:600;color:var(--ss-text-secondary,#3D4750)">Telefon<span aria-hidden="true" style="color:var(--ss-status-error,#B3261E)"> *</span></span>
                <div style="display:grid;grid-template-columns:128px minmax(0,1fr);gap:8px">
                  <dc-import name="Select" ariaLabel="Předvolba" variant="outline" fullWidth="{{ true }}" options="{{ prefixes }}" value="{{ f.prefix }}" onChange="{{ on.prefix }}" hint-size="128px,44px"></dc-import>
                  <dc-import name="Input" label="" ariaLabel="Telefonní číslo" type="tel" required="{{ true }}" autoComplete="tel-national" bordered="{{ true }}" value="{{ f.phone }}" onChange="{{ on.phone }}" hint="Na toto číslo vám dáme vědět o doručení objednávky." hint-size="100%,64px"></dc-import>
                </div>
              </div>

              <div style="padding-top:20px;border-top:1px solid var(--ss-border-subtle,#E1E6EB)">
                <dc-import name="Checkbox" label="Nakupuji na firmu" checked="{{ f.company }}" onChange="{{ on.company }}" hint-size="100%,44px"></dc-import>
              </div>

              <sc-if value="{{ f.company }}" hint-placeholder-val="{{ false }}">
                <section aria-labelledby="ss-k3-fakt" style="display:flex;flex-direction:column;gap:20px">
                  <h2 id="ss-k3-fakt" style="margin:0;font-size:{{ h3Size }};line-height:1.2">Fakturační údaje</h2>
                  <dc-import name="Input" label="IČ" required="{{ true }}" bordered="{{ true }}" value="{{ f.ico }}" onChange="{{ on.ico }}" hint-size="100%,70px"></dc-import>
                  <div style="display:grid;grid-template-columns:minmax(0,1fr) 32px;gap:8px;align-items:end">
                    <dc-import name="Input" label="DIČ (jen plátci DPH)" placeholder="CZ12345678" bordered="{{ true }}" value="{{ f.dic }}" onChange="{{ on.dic }}" hint-size="100%,70px"></dc-import>
                    <span style="display:flex;height:44px;align-items:center"><dc-import name="InfoPopover" title="DIČ" items="{{ dicInfo }}" hint-size="32px,32px"></dc-import></span>
                  </div>
                  <dc-import name="Input" label="Název společnosti" autoComplete="organization" bordered="{{ true }}" value="{{ f.firm }}" onChange="{{ on.firm }}" hint-size="100%,70px"></dc-import>
                </section>
              </sc-if>

              <div style="display:flex;flex-direction:column;gap:20px;padding-top:20px;border-top:1px solid var(--ss-border-subtle,#E1E6EB)">
                <dc-import name="Input" label="Ulice a číslo domu" required="{{ true }}" autoComplete="street-address" bordered="{{ true }}" value="{{ f.street }}" onChange="{{ on.street }}" hint-size="100%,70px"></dc-import>
                <div style="display:grid;grid-template-columns:{{ cityCols }};gap:16px">
                  <dc-import name="Input" label="Město" required="{{ true }}" autoComplete="address-level2" bordered="{{ true }}" value="{{ f.city }}" onChange="{{ on.city }}" hint-size="100%,70px"></dc-import>
                  <dc-import name="Input" label="PSČ" required="{{ true }}" autoComplete="postal-code" bordered="{{ true }}" value="{{ f.zip }}" onChange="{{ on.zip }}" hint-size="100%,70px"></dc-import>
                </div>
              </div>

              <div style="display:flex;flex-direction:column;gap:4px;padding-top:20px;border-top:1px solid var(--ss-border-subtle,#E1E6EB)">
                <dc-import name="Checkbox" label="Doručit na jinou adresu" checked="{{ f.other }}" onChange="{{ on.other }}" hint-size="100%,44px"></dc-import>
                <sc-if value="{{ f.other }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;flex-direction:column;gap:20px;padding:12px 0 20px">
                    <dc-import name="Input" label="Jméno a příjmení příjemce" required="{{ true }}" bordered="{{ true }}" value="{{ f.dName }}" onChange="{{ on.dName }}" hint-size="100%,70px"></dc-import>
                    <dc-import name="Input" label="Ulice a číslo domu" required="{{ true }}" bordered="{{ true }}" value="{{ f.dStreet }}" onChange="{{ on.dStreet }}" hint-size="100%,70px"></dc-import>
                    <div style="display:grid;grid-template-columns:{{ cityCols }};gap:16px">
                      <dc-import name="Input" label="Město" required="{{ true }}" bordered="{{ true }}" value="{{ f.dCity }}" onChange="{{ on.dCity }}" hint-size="100%,70px"></dc-import>
                      <dc-import name="Input" label="PSČ" required="{{ true }}" bordered="{{ true }}" value="{{ f.dZip }}" onChange="{{ on.dZip }}" hint-size="100%,70px"></dc-import>
                    </div>
                  </div>
                </sc-if>
                <dc-import name="Checkbox" label="Přidat poznámku pro prodejce" checked="{{ f.note }}" onChange="{{ on.note }}" hint-size="100%,44px"></dc-import>
                <sc-if value="{{ f.note }}" hint-placeholder-val="{{ false }}">
                  <div style="padding-top:8px">
                    <textarea class="ss-k3-ta" aria-label="Poznámka pro prodejce" placeholder="Např. kdy jste k zastižení nebo jak k vám dojet" value="{{ f.noteText }}" onChange="{{ on.noteText }}"></textarea>
                  </div>
                </sc-if>
              </div>
            </section>
          </div>

          <div style="{{ asideWrap }}">
            <dc-import name="ShrnutiObjednavky" items="{{ items }}" lines="{{ lines }}" total="{{ total }}" totalNoVat="{{ totalNoVat }}" checks="{{ checks }}" onCheck="{{ onCheck }}" termsNote="{{ true }}" termsChecked="{{ terms }}" onTerms="{{ onTerms }}" ctaLabel="Odeslat objednávku" ctaSublabel="s povinností platby" ctaHref="#objednavka-odeslana" backLabel="Zpět k dopravě a platbě" backHref="KosikKrok2.dc.html" hint-size="100%,900px"></dc-import>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer style="width:100%;background:var(--ss-surface-subtle,#FAF5EF);border-top:1px solid var(--ss-border-subtle,#E1E6EB)">
    <div style="{{ innerFoot }}">
      <span style="font-size:13px;color:var(--ss-text-muted,#5B6874);text-align:center">Copyright © 2026 LUCKÉ CZ GROUP s.r.o. — Všechna práva vyhrazena</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1600}}">
class Component extends DCLogic {
  state = {
    width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440,
    led: true,
    f: { name: '', email: '', prefix: '+420', phone: '', company: false, ico: '', dic: '', firm: '', street: '', city: '', zip: '', other: false, dName: '', dStreet: '', dCity: '', dZip: '', note: false, noteText: '' },
    optSurvey: false, optNews: false, terms: false
  };
  componentDidMount() {
    this._r = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + '\u00A0Kč'; }
  set(k, v) { this.setState(s => ({ f: Object.assign({}, s.f, { [k]: v }) })); }
  renderVals() {
    const w = this.state.width;
    const narrow = w < 820, wide = w >= 1000;
    const pad = narrow ? '16px' : '32px';
    const goods = [
      { title: 'Manželská postel SANTE 45 dvoulůžko', variant: '200 × 180 cm · olej Teak · jádrový buk', qty: 2, unit: 19990, img: 'produkt-sante-45.jpg' },
      { title: 'Matrace Spring Variant 22 cm', variant: '180 × 200 cm · tuhost H3', qty: 1, unit: 7590, img: 'produkt-matrace-spring-variant.png' }
    ];
    const delFee = 1500;
    const total = goods.reduce((s, g) => s + g.unit * g.qty, 0) + delFee;
    const on = {};
    Object.keys(this.state.f).forEach(k => { on[k] = (v) => this.set(k, v); });
    on.noteText = (e) => this.set('noteText', e.target.value);
    return {
      ledMode: this.state.led ? 'on' : 'off',
      presItems: [{ label: 'LED', value: this.state.led }],
      onPresToggle: () => this.setState(s => ({ led: !s.led })),
      inner: { maxWidth: '1560px', margin: '0 auto', boxSizing: 'border-box', padding: (narrow ? '32px ' : '48px ') + pad + (narrow ? ' 48px' : ' 80px') },
      innerFoot: { maxWidth: '1560px', margin: '0 auto', boxSizing: 'border-box', padding: '16px ' + pad, display: 'flex', justifyContent: 'center' },
      cols: wide ? 'minmax(0,1fr) minmax(360px,440px)' : 'minmax(0,1fr)',
      colGap: wide ? '64px' : '48px',
      asideWrap: wide ? { minWidth: 0, paddingLeft: '48px', borderLeft: '1px solid var(--ss-border-subtle,#E1E6EB)', alignSelf: 'stretch' } : { minWidth: 0 },
      h2Size: narrow ? '24px' : '28px',
      h3Size: narrow ? '20px' : '22px',
      cityCols: w >= 550 ? 'minmax(0,1fr) 160px' : 'minmax(0,1fr)',
      f: this.state.f, on,
      prefixes: [{ value: '+420', label: 'CZ +420' }, { value: '+421', label: 'SK +421' }],
      dicInfo: ['Vyplňte, jen pokud je firma plátcem DPH', 'Formát: kód země a číslo, např. CZ12345678', 'Fakturu vystavíme s DIČ automaticky'],
      items: goods.map(g => ({ title: g.title, variant: g.variant, qty: g.qty, img: g.img, total: this.fmt(g.unit * g.qty) })),
      lines: [
        { label: 'Doprava', name: 'Vlastní doprava s vynáškou do patra', value: this.fmt(delFee) },
        { label: 'Platba', name: 'Platba kartou online', value: 'Zdarma' }
      ],
      checks: [
        { label: 'Nezasílat dotazník spokojenosti v rámci programu Ověřeno zákazníky', checked: this.state.optSurvey },
        { label: 'Nepřeji si dostávat exkluzivní slevy a tipy e-mailem', checked: this.state.optNews }
      ],
      terms: this.state.terms,
      onTerms: (v) => this.setState({ terms: v }),
      onCheck: (i, v) => this.setState(i === 0 ? { optSurvey: v } : { optNews: v }),
      total: this.fmt(total),
      totalNoVat: this.fmt(total / 1.21)
    };
  }
}
</script>
</body>
</html>

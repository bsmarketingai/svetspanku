<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
a{color:var(--ss-link,#296093);}a:hover{color:var(--ss-hover-text,#A4600C);}
.ss-tm-close{display:flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border:0;border-radius:6px;background:none;color:var(--ss-text-muted,#5B6874);cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-tm-close:hover{background:var(--ss-hover-bg,#F0F5FA);color:var(--ss-hover-text,#21507B);}}
.ss-tm-close:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
</style>
</helmet>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div class="ss-scrim" onClick="{{ onScrim }}" style="position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;font-family:Roboto,Helvetica,Arial,sans-serif;cursor:default">
    <div role="dialog" aria-modal="true" aria-labelledby="ss-tm-title" ref="{{ dialogRef }}" style="width:100%;max-width:720px;max-height:calc(100vh - 32px);overflow-y:auto;box-sizing:border-box;background:var(--ss-surface-card,#FFFFFF);border-radius:12px;box-shadow:0 16px 40px rgba(19,44,67,.18);color:var(--ss-text-primary,#1C2229);padding:{{ pad }};display:flex;flex-direction:column;gap:24px;text-align:left">
      <div style="display:flex;align-items:flex-start;gap:16px">
        <h2 id="ss-tm-title" style="flex:1;min-width:0;margin:0;font-size:{{ titleSize }};line-height:1.15;text-wrap:balance">Jak vybrat tuhost matrace</h2>
        <button type="button" class="ss-tm-close" ref="{{ closeRef }}" onClick="{{ close }}" aria-label="Zavřít">
          <dc-import name="Ikony" iconName="x" size="24" hint-size="24px,24px"></dc-import>
        </button>
      </div>
      <p style="margin:0;font-size:16px;line-height:1.6;color:var(--ss-text-secondary,#3D4750);text-wrap:pretty">Tuhost značíme stupni H1 až H5. Správná matrace drží páteř v rovině – rozhoduje hmotnost i poloha, ve které nejčastěji spíte. Půlstupně (např. H4,5) leží mezi dvěma sousedními tuhostmi.</p>
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px">
        <sc-for list="{{ levels }}" as="l" hint-placeholder-count="5">
          <li style="display:grid;grid-template-columns:{{ rowCols }};gap:16px;align-items:center;padding:12px;border-radius:12px;background:{{ l.bg }};box-shadow:{{ l.ring }}">
            <img src="{{ l.image }}" alt="{{ l.alt }}" style="display:block;width:100%;aspect-ratio:3/2;object-fit:contain" />
            <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px">
                <span style="font-family:Oswald,Roboto,sans-serif;font-weight:700;font-size:18px;color:var(--ss-text-heading,#0B1F33)">{{ l.title }}</span>
                <sc-if value="{{ l.current }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;background:#296093;color:#FFFFFF">Tento produkt</span>
                </sc-if>
              </div>
              <span aria-hidden="true" style="display:grid;grid-template-columns:repeat(5,18px);gap:3px">
                <sc-for list="{{ l.segs }}" as="s" hint-placeholder-count="5">
                  <span style="display:block;height:6px;border-radius:999px;background:{{ s.bg }};box-shadow:{{ s.ring }}"></span>
                </sc-for>
              </span>
              <span style="font-size:14px;font-weight:600;color:var(--ss-text-primary,#1C2229)">{{ l.who }}</span>
              <span style="font-size:14px;line-height:1.55;color:var(--ss-text-secondary,#3D4750);text-wrap:pretty">{{ l.text }}</span>
            </div>
          </li>
        </sc-for>
      </ul>
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        <dc-import name="Tlacitko" label="Průvodce výběrem matrace" variant="primary" size="large" href="#pruvodce" hint-size="260px,52px"></dc-import>
        <dc-import name="Tlacitko" label="Zavřít" variant="secondary" size="large" onClick="{{ close }}" hint-size="120px,52px"></dc-import>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:900},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4.5,&quot;min&quot;:1,&quot;max&quot;:5,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  static SHADES = ['#B9D0E5', '#8DB3D3', '#296093', '#21507B', '#132C43'];
  static LEVELS = [
    { n: 1, title: 'H1 – Velmi měkká', image: 'tvrdost-mekka.png', who: 'Do 60 kg · spaní na boku', text: 'Ramena a boky se hluboce zaboří, páteř zůstane rovná i u lehčích postav. Vhodná i pro seniory a citlivé klouby.' },
    { n: 2, title: 'H2 – Měkká', image: 'tvrdost-stredne-mekka.png', who: '60–80 kg · na boku i na zádech', text: 'Příjemně se přizpůsobí, ale nepropadá se. Dobrá volba pro střídání poloh během noci.' },
    { n: 3, title: 'H3 – Středně tuhá', image: 'tvrdost-stredne-tvrda.png', who: '75–100 kg · univerzální', text: 'Nejčastější volba. Vyvážená opora pro většinu spáčů na boku i na zádech.' },
    { n: 4, title: 'H4 – Tvrdá', image: 'tvrdost-tvrda.png', who: '90–120 kg · na zádech a na břiše', text: 'Pánev se nepropadá, záda zůstávají v rovině. Vhodná pro těžší postavy a spaní na zádech.' },
    { n: 5, title: 'H5 – Velmi tvrdá', image: 'tvrdost-nejtvrdsi.png', who: 'Nad 120 kg · pevná opora', text: 'Minimální prohnutí i při vysoké zátěži. Pro ty, kdo chtějí cítit pevnou podložku.' }
  ];
  state = { w: 1200 };
  dialogRef = React.createRef();
  closeRef = React.createRef();
  componentDidMount() {
    this._rs = () => this.setState({ w: window.innerWidth });
    this._rs(); window.addEventListener('resize', this._rs);
    if (this.props.open) this.activate();
  }
  componentDidUpdate(prev) {
    if (this.props.open && !prev.open) this.activate();
    if (!this.props.open && prev.open) this.deactivate(true);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._rs); this.deactivate(false); }
  activate() {
    this._ret = document.activeElement;
    this._ov = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    this._key = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); this.doClose(); return; }
      if (e.key !== 'Tab' || !this.dialogRef.current) return;
      const f = Array.from(this.dialogRef.current.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])'));
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', this._key);
    requestAnimationFrame(() => { if (this.closeRef.current) this.closeRef.current.focus(); });
  }
  deactivate(restore) {
    if (!this._key) return;
    document.removeEventListener('keydown', this._key);
    this._key = null;
    document.body.style.overflow = this._ov || '';
    if (restore && this._ret && this._ret.focus) this._ret.focus();
  }
  doClose() { if (this.props.onClose) this.props.onClose(); }
  renderVals() {
    const w = this.state.w;
    const v = Number(this.props.value ?? 0);
    const cur = v ? Math.ceil(v) : 0;
    const curLow = v ? Math.floor(v) : 0;
    const track = 'var(--ss-surface-card,#FFFFFF)';
    const ring = 'inset 0 0 0 1px #8DB3D3';
    return {
      open: !!this.props.open,
      pad: w < 550 ? '20px' : '32px',
      titleSize: w < 820 ? '24px' : '28px',
      rowCols: w < 550 ? '112px minmax(0,1fr)' : '200px minmax(0,1fr)',
      levels: Component.LEVELS.map(l => {
        const on = l.n === cur || l.n === curLow;
        return Object.assign({}, l, {
          alt: 'Figurína na matraci – tuhost ' + l.title,
          current: on,
          bg: on ? 'var(--ss-surface-selected,#DCE8F2)' : 'var(--ss-surface-subtle,#FAF5EF)',
          ring: on ? 'inset 0 0 0 2px #296093' : 'none',
          segs: [0, 1, 2, 3, 4].map(i => ({ bg: i < l.n ? Component.SHADES[i] : track, ring: i < l.n ? 'none' : ring }))
        });
      }),
      dialogRef: this.dialogRef,
      closeRef: this.closeRef,
      close: () => this.doClose(),
      onScrim: (e) => { if (e.target === e.currentTarget) this.doClose(); }
    };
  }
}
</script>
</body>
</html>

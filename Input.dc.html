<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

.ss-input-wrap{font-family:Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;gap:6px;min-width:0;}
.ss-input-field{position:relative;display:flex;align-items:center;min-width:0;}
.ss-input{font-family:inherit;color:var(--ss-text-primary,#1C2229);width:100%;min-width:0;border:0;border-radius:6px;transition:background-color .12s cubic-bezier(.22,.61,.36,1),box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.ss-input::placeholder{color:var(--ss-text-muted,#5B6874);}
.ss-input:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35),inset 0 0 0 1px var(--ss-border-action,#296093);}
.ss-input:disabled{background:var(--ss-surface-muted,#EFF2F5)!important;color:var(--ss-text-muted,#5B6874);cursor:not-allowed;}
.ss-input-icon{position:absolute;left:12px;display:flex;pointer-events:none;color:var(--ss-text-muted,#55616C);}
.ss-input-end{position:absolute;right:4px;top:0;bottom:0;display:flex;align-items:center;gap:0;}
.ss-input-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--ss-text-muted,#55616C);cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1);}
.ss-input-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
@media (hover:hover) and (pointer:fine){.ss-input-btn:hover{background:var(--ss-hover-bg,#FFF5E6);color:var(--ss-hover-text,#A4600C);}}
@media (max-width:549px){.ss-input{font-size:16px!important;}}
.ss-input[type=number]{-moz-appearance:textfield;appearance:textfield;}
.ss-input[type=number]::-webkit-outer-spin-button,.ss-input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
</style>
</helmet>
<div class="ss-input-wrap" style="{{ wrapStyle }}">
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}">
    <label style="font-size:13px;font-weight:600;color:var(--ss-text-secondary,#3D4750)" for="{{ id }}">{{ label }}<sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color:var(--ss-status-error,#B3261E)"> *</span></sc-if></label>
  </sc-if>
  <div class="ss-input-field">
    <sc-if value="{{ hasIconLeft }}" hint-placeholder-val="{{ false }}">
      <span class="ss-input-icon"><dc-import name="Ikony" iconName="{{ icon }}" size="18" hint-size="18px,18px"></dc-import></span>
    </sc-if>
    <input class="ss-input" id="{{ id }}" type="{{ type }}" style="{{ inputStyle }}" style-hover="{{ hoverStyle }}" value="{{ value }}" placeholder="{{ placeholder }}" onChange="{{ handleChange }}" onBlur="{{ handleBlur }}" onFocus="{{ handleFocus }}" onKeyDown="{{ handleKeyDown }}" disabled="{{ disabled }}" required="{{ required }}" autoComplete="{{ autoComplete }}" aria-label="{{ ariaLabel }}" aria-invalid="{{ ariaInvalid }}" aria-describedby="{{ describedBy }}" />
    <sc-if value="{{ hasEnd }}" hint-placeholder-val="{{ false }}">
      <span class="ss-input-end">
        <sc-if value="{{ showClear }}" hint-placeholder-val="{{ false }}">
          <button type="button" class="ss-input-btn" onClick="{{ handleClear }}" aria-label="{{ clearLabel }}"><dc-import name="Ikony" iconName="x" size="18" hint-size="18px,18px"></dc-import></button>
        </sc-if>
        <sc-if value="{{ hasIconRight }}" hint-placeholder-val="{{ false }}">
          <button type="submit" class="ss-input-btn" aria-label="{{ submitLabel }}"><dc-import name="Ikony" iconName="{{ icon }}" size="20" hint-size="20px,20px"></dc-import></button>
        </sc-if>
      </span>
    </sc-if>
  </div>
  <sc-if value="{{ hasHint }}" hint-placeholder-val="{{ false }}">
    <span id="{{ hintId }}" style="{{ hintStyle }}">{{ hint }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:140},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;E-mail&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;autoComplete&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;vas@email.cz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;text&quot;,&quot;options&quot;:[&quot;text&quot;,&quot;email&quot;,&quot;tel&quot;,&quot;number&quot;,&quot;search&quot;,&quot;password&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;bordered&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;iconRight&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;clearable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;typingPlaceholder&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClear&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;invalid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;},&quot;onBlur&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;},&quot;onEnter&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { typed: null, focused: false };
  componentDidMount() { if (this.props.typingPlaceholder) this.startTyping(); }
  componentWillUnmount() { clearTimeout(this._t); }
  startTyping() {
    const full = this.props.placeholder || '';
    if (!full) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let i = 0, dir = 1;
    const step = () => {
      if (this.state.focused || this.props.value) { this.setState({ typed: null }); this._t = setTimeout(step, 600); return; }
      i += dir;
      this.setState({ typed: full.slice(0, i) });
      let wait = dir > 0 ? 70 + Math.random() * 60 : 28;
      if (i >= full.length) { dir = -1; wait = 2600; }
      else if (i <= 0) { dir = 1; wait = 700; }
      this._t = setTimeout(step, wait);
    };
    this._t = setTimeout(step, 500);
  }
  renderVals() {
    const p = this.props;
    const compact = p.size === 'compact';
    const h = compact ? 36 : 44;
    const invalid = !!p.invalid;
    const uid = this._id || (this._id = Math.random().toString(36).slice(2, 8));
    const id = p.id || ('ss-input-' + uid);
    const hint = p.hint;
    return {
      id, hintId: id + '-hint',
      hasLabel: !!p.label, label: p.label ?? 'Popisek pole',
      required: !!p.required, autoComplete: p.autoComplete,
      ariaLabel: p.label ? undefined : p.ariaLabel,
      type: p.type || 'text',
      value: p.value ?? '',
      placeholder: (p.typingPlaceholder && this.state.typed !== null) ? this.state.typed + '|' : (p.placeholder ?? ''),
      disabled: !!p.disabled,
      hasIconLeft: !!p.icon && !p.iconRight, hasIconRight: !!p.icon && !!p.iconRight, icon: p.icon,
      hasEnd: (!!p.icon && !!p.iconRight) || !!p.clearable,
      showClear: !!p.clearable && !!p.value,
      clearLabel: p.clearLabel || 'Vymazat',
      submitLabel: p.submitLabel || 'Hledat',
      handleClear: () => { if (p.onClear) p.onClear(); else if (p.onChange) p.onChange(''); },
      hasHint: !!hint, hint,
      hintStyle: { fontSize: '13px', color: invalid ? 'var(--ss-status-error,#B3261E)' : 'var(--ss-text-muted,#5B6874)' },
      ariaInvalid: invalid ? 'true' : undefined,
      describedBy: hint ? id + '-hint' : undefined,
      wrapStyle: { width: p.fullWidth === false ? undefined : '100%' },
      inputStyle: {
        height: h + 'px', fontSize: (compact ? 14 : 15) + 'px',
        padding: '0 ' + (p.iconRight ? (p.clearable && p.value ? 84 : 48) : 14) + 'px 0 ' + (p.icon && !p.iconRight ? 38 : 14) + 'px',
        background: p.bordered ? 'var(--ss-surface-page,#FFFFFF)' : 'var(--ss-surface-subtle,#F7F9FB)',
        boxShadow: 'inset 0 0 0 1px ' + (invalid ? 'var(--ss-border-error,#B3261E)' : (p.bordered ? 'var(--ss-border-subtle,#E1E6EB)' : 'transparent'))
      },
      hoverStyle: p.disabled ? {} : (p.bordered ? { boxShadow: 'inset 0 0 0 1px ' + (invalid ? 'var(--ss-border-error,#B3261E)' : 'var(--ss-border-strong,#C8D0D8)') } : { background: 'var(--ss-surface-muted,#EFF2F5)' }),
      handleChange: (e) => { if (p.onChange) p.onChange(e.target.value); },
      handleBlur: (e) => { this.setState({ focused: false }); if (p.onBlur) p.onBlur(e.target.value); },
      handleFocus: () => this.setState({ focused: true }),
      handleKeyDown: (e) => {
        if (p.onEnter && e.key === 'Enter') { e.preventDefault(); p.onEnter(e.target.value); }
        if (p.onKeyDown) p.onKeyDown(e);
      }
    };
  }
}
</script>
</body>
</html>

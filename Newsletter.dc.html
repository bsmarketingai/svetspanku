<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
</style>
</helmet>
<div style="{{ wrapStyle }}">
  <div style="{{ textStyle }}">
    <h2 style="{{ hStyle }}">Dostávejte novinky ze Světa spánku</h2>
    <p style="{{ pStyle }}">Slevy, akce, výprodeje a novinky o spánkové vědě. Jednou za týden, bez balastu.</p>
    <div style="{{ perksStyle }}">
    <sc-for list="{{ perks }}" as="n" hint-placeholder-count="3">
      <span style="{{ chipStyle }}"><span style="display:flex"><dc-import name="Ikony" iconName="circle-check" size="16" hint-size="16px,16px"></dc-import></span>{{ n }}</span>
    </sc-for>
    </div>
  </div>
  <form style="{{ formStyle }}" onSubmit="{{ submit }}">
    <div style="{{ inputWrap }}">
      <dc-import name="Input" label="" type="email" icon="mail" white="{{ true }}" placeholder="Váš e-mail" ariaLabel="Váš e-mail" value="{{ email }}" onChange="{{ onEmail }}" hint-size="100%,44px"></dc-import>
    </div>
    <dc-import name="Tlacitko" label="Chci newsletter" variant="{{ btnVariant }}" onClick="{{ doNews }}" hint-size="170px,44px"></dc-import>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:320},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSubscribe&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(email: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { email: '' };
  renderVals() {
    const p = this.props;
    const dark = !!p.dark;
    const st = !!p.narrow;
    return {
      wrapStyle: st ? { maxWidth: '560px', margin: '0 auto', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '24px', textAlign: 'center', fontFamily: 'Roboto,Helvetica,Arial,sans-serif', color: 'var(--ss-text-primary,#1C2229)' } : { display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,auto)', alignItems: 'center', gap: '48px', fontFamily: 'Roboto,Helvetica,Arial,sans-serif', color: 'var(--ss-text-primary,#1C2229)' },
      textStyle: { display: 'flex', flexDirection: 'column', alignItems: st ? 'center' : 'flex-start', gap: '8px', minWidth: 0 },
      perksStyle: { display: 'flex', flexWrap: 'wrap', justifyContent: st ? 'center' : 'flex-start', gap: '8px', marginTop: '8px' },
      formStyle: st ? { width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px', minWidth: 0 } : { display: 'flex', alignItems: 'flex-start', gap: '12px', minWidth: 0 },
      inputWrap: st ? { width: 'min(100%,336px)', minWidth: 0, textAlign: 'left' } : { width: '336px', minWidth: 0, textAlign: 'left' },
      hStyle: { margin: 0, fontSize: p.narrow ? '21px' : '26px', lineHeight: 1.2, textWrap: 'balance', color: dark ? '#FFFFFF' : undefined },
      pStyle: { margin: 0, fontSize: '14px', color: dark ? '#DCE8F2' : 'var(--ss-text-secondary,#3D4750)', textWrap: 'pretty' },
      chipStyle: { display: 'inline-flex', alignItems: 'center', gap: '8px', background: dark ? 'rgba(255,255,255,.08)' : 'var(--ss-surface-card,#FFFFFF)', borderRadius: '999px', padding: '6px 14px', fontSize: '13px', fontWeight: 600, color: dark ? '#71CC92' : 'var(--ss-status-success,#157A41)' },
      btnVariant: dark ? 'buy' : 'primary',
      perks: ['Nejvýše 2× týdně', 'Odebírá přes 110 000 lidí', 'Odhlásíte se jedním kliknutím'],
      email: this.state.email,
      onEmail: (v) => this.setState({ email: v }),
      submit: (e) => e.preventDefault(),
      doNews: () => { if (p.onSubscribe) p.onSubscribe(this.state.email); }
    };
  }
}
</script>
</body>
</html>

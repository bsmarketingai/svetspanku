<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')!=='light')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h',localStorage.getItem('ss-font-h')||'alt');d.setAttribute('data-font-b',localStorage.getItem('ss-font-b')||'alt');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

.ss-bc a{text-decoration:none;color:var(--ss-text-muted,#5B6874);border-radius:4px;transition:color .12s cubic-bezier(.22,.61,.36,1);}
.ss-bc a:hover{color:var(--ss-hover-text,#A4600C);text-decoration:underline;text-underline-offset:3px;}
.ss-bc a:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
@media (max-width:819px){.ss-bc-ol{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;padding:4px 0!important;white-space:nowrap;}.ss-bc-ol::-webkit-scrollbar{display:none;}}
.ss-bc[data-tone="photo"]{text-shadow:0 1px 2px rgba(0,0,0,.45);}
.ss-bc[data-tone="photo"] ol{padding:0!important;}
.ss-bc[data-tone="photo"] a,.ss-bc[data-tone="photo"] [aria-current]{color:#FFFFFF!important;}
.ss-bc[data-tone="photo"] a:hover{color:#FBB255!important;}
.ss-bc[data-tone="photo"] a:focus-visible{box-shadow:0 0 0 3px rgba(251,178,85,.7);}
.ss-bc[data-tone="photo"] [aria-hidden="true"]{color:rgba(255,255,255,.8)!important;}
</style>
</helmet>
<nav class="ss-bc" data-tone="{{ tone }}" aria-label="Drobečková navigace" style="font-family:Roboto,Helvetica,Arial,sans-serif;font-size:13px;min-width:0">
  <ol class="ss-bc-ol" style="list-style:none;margin:0;padding:16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="3">
      <li style="display:flex;align-items:center;gap:6px;min-width:0;flex:none">
        <sc-if value="{{ i.isLink }}" hint-placeholder-val="{{ true }}">
          <a href="{{ i.href }}" style="display:inline-flex;align-items:center;min-height:24px">{{ i.label }}</a>
        </sc-if>
        <sc-if value="{{ i.isCurrent }}" hint-placeholder-val="{{ false }}">
          <span aria-current="page" style="color:var(--ss-text-secondary,#3D4750);font-weight:600">{{ i.label }}</span>
        </sc-if>
        <sc-if value="{{ i.hasSep }}" hint-placeholder-val="{{ true }}">
          <span aria-hidden="true" style="display:flex;color:var(--ss-text-disabled,#9AA6B2)"><dc-import name="Ikony" iconName="chevron-right" size="14" hint-size="14px,14px"></dc-import></span>
        </sc-if>
      </li>
    </sc-for>
  </ol>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:60},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;photo&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default' | 'photo'&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label: string, href?: string}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = this.props.items && this.props.items.length ? this.props.items : [
      { label: 'Domů', href: '#domu' },
      { label: 'Matrace', href: '#matrace' },
      { label: 'Taštičkové matrace', href: '#tastickove' },
      { label: 'Matrace Spring Variant 22 cm' }
    ];
    const last = items.length - 1;
    return {
      tone: this.props.tone === 'photo' ? 'photo' : 'default',
      items: items.map((i, idx) => ({
        label: i.label,
        href: i.href || '#',
        isLink: idx !== last && !!i.href,
        isCurrent: idx === last || !i.href,
        hasSep: idx !== last
      }))
    };
  }
}
</script>
</body>
</html>

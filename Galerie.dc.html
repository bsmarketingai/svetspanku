<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Archivo,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:800!important;font-stretch:75%;text-transform:uppercase;letter-spacing:-0.005em;}

.ss-gl-th{display:flex;align-items:center;justify-content:center;width:72px;height:72px;flex:none;border:0;border-radius:8px;background:#F7F9FB;color:#C8D0D8;cursor:pointer;transition:box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.ss-gl-th:hover{box-shadow:inset 0 0 0 2px #8DB3D3;}
.ss-gl-th[aria-current="true"]{box-shadow:inset 0 0 0 2px #296093;}
.ss-gl-th:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-gl-arrow{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#21507B;cursor:pointer;box-shadow:0 2px 8px rgba(19,44,67,.08);}
.ss-gl-arrow:hover{background:#FFFFFF;}
.ss-gl-arrow:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
</style>
</helmet>
<div style="font-family:Archivo,Helvetica,Arial,sans-serif;display:flex;gap:16px;width:100%;min-width:0;{{ dirStyle }}">
  <sc-if value="{{ showThumbs }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:8px;flex:none" role="tablist" aria-label="Náhledy fotek">
      <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="5">
        <button type="button" class="ss-gl-th" onClick="{{ t.onSelect }}" aria-current="{{ t.current }}" aria-label="{{ t.aria }}">
          <dc-import name="Ikony" iconName="photo" size="20" hint-size="20px,20px"></dc-import>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <div style="position:relative;flex:1;min-width:0">
    <div style="width:100%;aspect-ratio:4/3;background:#F7F9FB;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#C8D0D8"
         onTouchStart="{{ onTouchStart }}" onTouchEnd="{{ onTouchEnd }}">
      <dc-import name="Ikony" iconName="photo" size="40" hint-size="40px,40px"></dc-import>
    </div>
    <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:12px;left:12px"><dc-import name="Stitek" kind="{{ badgeKind }}" label="{{ badgeLabel }}" hint-size="90px,26px"></dc-import></span>
    </sc-if>
    <button type="button" class="ss-gl-arrow" style="left:12px" onClick="{{ prev }}" aria-label="Předchozí fotka">
      <dc-import name="Ikony" iconName="chevron-left" size="22" hint-size="22px,22px"></dc-import>
    </button>
    <button type="button" class="ss-gl-arrow" style="right:12px" onClick="{{ next }}" aria-label="Další fotka">
      <dc-import name="Ikony" iconName="chevron-right" size="22" hint-size="22px,22px"></dc-import>
    </button>
    <span style="position:absolute;right:12px;bottom:12px;background:rgba(19,44,67,.82);color:#FFFFFF;font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px" aria-live="polite">{{ counter }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:420},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;sale&quot;,&quot;news&quot;,&quot;freeShip&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;badgeLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { i: 0, width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440 };
  componentDidMount() {
    this._resize = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._resize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._resize); }
  renderVals() {
    const p = this.props;
    const count = p.count ?? 5;
    const i = Math.min(this.state.i, count - 1);
    const go = (n) => this.setState({ i: (n + count) % count });
    return {
      showThumbs: this.state.width >= 820,
      dirStyle: '',
      thumbs: Array.from({ length: count }, (_, n) => ({
        current: n === i ? 'true' : 'false',
        aria: 'Fotka ' + (n + 1),
        onSelect: () => go(n)
      })),
      counter: (i + 1) + ' / ' + count,
      hasBadge: !!p.badge,
      badgeKind: p.badge,
      badgeLabel: p.badgeLabel,
      prev: () => go(i - 1),
      next: () => go(i + 1),
      onTouchStart: (e) => { this._x = e.touches[0].clientX; },
      onTouchEnd: (e) => {
        if (this._x === undefined) return;
        const dx = e.changedTouches[0].clientX - this._x;
        if (Math.abs(dx) > 40) go(dx < 0 ? i + 1 : i - 1);
        this._x = undefined;
      }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
.ss-pk-t{color:var(--ss-text-primary,#1C2229);text-decoration:none;border-radius:4px;transition:color .12s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-pk-t:hover{color:var(--ss-hover-text,#21507B);text-decoration:underline;text-underline-offset:3px;}}
.ss-pk-t:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-pk-x{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:0;border-radius:6px;background:none;color:var(--ss-text-muted,#5B6874);cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-pk-x:hover{background:var(--ss-hover-bg,#F0F5FA);color:var(--ss-hover-text,#21507B);}}
.ss-pk-x:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-pk-x:active{transform:scale(.96);transition-duration:.06s;}
</style>
</helmet>
<article style="font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1C2229);box-sizing:border-box;width:100%;padding:24px 0;border-bottom:1px solid var(--ss-border-subtle,#E1E6EB)">
  <sc-if value="{{ isRow }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:120px minmax(0,1fr) 140px 132px 120px 44px;gap:24px;align-items:center">
      <a href="{{ href }}" tabindex="-1" aria-hidden="true" style="display:flex;align-items:center;justify-content:center;width:120px;height:96px;border-radius:6px;overflow:hidden;background:{{ mediaBg }};color:var(--ss-text-decor,#C8D0D8)">
        <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ img }}" alt="" style="display:block;width:100%;height:100%;object-fit:cover" /></sc-if>
        <sc-if value="{{ noImg }}" hint-placeholder-val="{{ true }}"><dc-import name="Ikony" iconName="photo" size="24" hint-size="24px,24px"></dc-import></sc-if>
      </a>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0">
        <h3 class="ss-plain" style="margin:0;font-size:17px;font-weight:600;line-height:1.35"><a class="ss-pk-t" href="{{ href }}">{{ title }}</a></h3>
        <span style="font-size:14px;color:var(--ss-text-muted,#5B6874)">{{ variant }}</span>
        <dc-import name="Stitek" kind="{{ stock }}" label="{{ stockLabel }}" hint-size="180px,20px"></dc-import>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right">
        <sc-if value="{{ hasBefore }}" hint-placeholder-val="{{ true }}">
          <s style="font-family:'Archivo Narrow',Roboto,sans-serif;font-size:14px;color:var(--ss-status-error,#B3261E)"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Původní cena </span>{{ priceBefore }}</s>
        </sc-if>
        <span style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:600;font-size:16px;white-space:nowrap;color:{{ unitColor }}">{{ unitText }}</span>
      </div>
      <div style="display:flex;justify-content:center"><dc-import name="Kvantifikator" value="{{ qty }}" onChange="{{ onQty }}" ariaLabel="{{ qtyLabel }}" hint-size="132px,44px"></dc-import></div>
      <span style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:20px;text-align:right;white-space:nowrap">{{ total }}</span>
      <button type="button" class="ss-pk-x" onClick="{{ remove }}" aria-label="{{ removeLabel }}"><dc-import name="Ikony" iconName="trash" size="20" hint-size="20px,20px"></dc-import></button>
    </div>
  </sc-if>

  <sc-if value="{{ isStack }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:grid;grid-template-columns:80px minmax(0,1fr) 44px;gap:16px;align-items:start">
        <a href="{{ href }}" tabindex="-1" aria-hidden="true" style="display:flex;align-items:center;justify-content:center;width:80px;height:64px;border-radius:6px;overflow:hidden;background:{{ mediaBg }};color:var(--ss-text-decor,#C8D0D8)">
          <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ img }}" alt="" style="display:block;width:100%;height:100%;object-fit:cover" /></sc-if>
          <sc-if value="{{ noImg }}" hint-placeholder-val="{{ true }}"><dc-import name="Ikony" iconName="photo" size="20" hint-size="20px,20px"></dc-import></sc-if>
        </a>
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0">
          <h3 class="ss-plain" style="margin:0;font-size:16px;font-weight:600;line-height:1.35"><a class="ss-pk-t" href="{{ href }}">{{ title }}</a></h3>
          <span style="font-size:13px;color:var(--ss-text-muted,#5B6874)">{{ variant }}</span>
          <dc-import name="Stitek" kind="{{ stock }}" label="{{ stockLabel }}" hint-size="180px,20px"></dc-import>
        </div>
        <button type="button" class="ss-pk-x" style="margin:-8px -8px 0 0" onClick="{{ remove }}" aria-label="{{ removeLabel }}"><dc-import name="Ikony" iconName="trash" size="20" hint-size="20px,20px"></dc-import></button>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
        <div style="display:flex;flex-direction:column;gap:4px;min-width:96px">
          <sc-if value="{{ hasBefore }}" hint-placeholder-val="{{ true }}">
            <s style="font-family:'Archivo Narrow',Roboto,sans-serif;font-size:14px;color:var(--ss-status-error,#B3261E)"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Původní cena </span>{{ priceBefore }}</s>
          </sc-if>
          <span style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:600;font-size:15px;white-space:nowrap;color:{{ unitColor }}">{{ unitText }}</span>
        </div>
        <dc-import name="Kvantifikator" value="{{ qty }}" onChange="{{ onQty }}" ariaLabel="{{ qtyLabel }}" hint-size="132px,44px"></dc-import>
        <span style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:19px;white-space:nowrap;margin-left:auto">{{ total }}</span>
      </div>
    </div>
  </sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:160},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;row&quot;,&quot;options&quot;:[&quot;row&quot;,&quot;stack&quot;],&quot;tsType&quot;:&quot;'row' | 'stack'&quot;},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title: string, variant: string, qty: number, unitPrice: string, priceBefore?: string, total: string, img?: string, fit?: string, href?: string, stock?: string, stockLabel?: string}&quot;},&quot;onQty&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: number) =&gt; void&quot;},&quot;onRemove&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const it = p.item || { title: 'Manželská postel SANTE 45 dvoulůžko', variant: '200 × 180 cm · olej Teak · jádrový buk', qty: 2, unitPrice: '19 990 Kč', priceBefore: '24 990 Kč', total: '39 980 Kč', img: 'produkt-sante-45.jpg', fit: 'cover', stock: 'inStock' };
    const stack = p.layout === 'stack';
    const sale = !!it.priceBefore;
    return {
      isRow: !stack, isStack: stack,
      title: it.title, variant: it.variant, href: it.href || 'Postel 3.0.dc.html',
      img: it.img || '', mediaBg: it.img ? 'transparent' : 'var(--ss-surface-muted,#F3EDE4)', hasImg: !!it.img, noImg: !it.img,
      stock: it.stock || 'inStock', stockLabel: it.stockLabel,
      hasBefore: sale, priceBefore: it.priceBefore,
      unitText: it.unitPrice + ' / ks',
      unitColor: 'var(--ss-text-primary,#1C2229)',
      qty: it.qty ?? 1,
      qtyLabel: 'Množství – ' + it.title,
      total: it.total,
      removeLabel: 'Odebrat z košíku: ' + it.title,
      onQty: (v) => { if (p.onQty) p.onQty(v); },
      remove: () => { if (p.onRemove) p.onRemove(); }
    };
  }
}
</script>
</body>
</html>

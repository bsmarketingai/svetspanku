<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

.ss-check{font-family:Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:6px;transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-check:has(input:disabled){opacity:.45;cursor:not-allowed;}
.ss-check input{position:absolute;opacity:0;width:0;height:0;}
.ss-check-box{display:flex;align-items:center;justify-content:center;flex:none;width:20px;height:20px;border-radius:4px;background:var(--ss-surface-page,#FFFFFF);box-shadow:inset 0 0 0 1px var(--ss-border-strong,#C8D0D8);color:#FFFFFF;transition:background-color .12s cubic-bezier(.22,.61,.36,1),box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.ss-check input:checked + .ss-check-box{background:#296093;box-shadow:inset 0 0 0 1px var(--ss-border-action,#296093);}
.ss-check input:focus-visible + .ss-check-box{box-shadow:0 0 0 3px rgba(41,96,147,.35),inset 0 0 0 1px var(--ss-border-action,#296093);}
.ss-check-mark{opacity:0;transition:opacity .12s cubic-bezier(.22,.61,.36,1);}
.ss-check input:checked + .ss-check-box .ss-check-mark{opacity:1;}
</style>
</helmet>
<label class="ss-check" style="{{ rowStyle }}" style-hover="background:{{ hoverBg }}">
  <input type="checkbox" checked="{{ checked }}" onChange="{{ handleChange }}" disabled="{{ disabled }}" />
  <span class="ss-check-box">
    <span class="ss-check-mark" style="display:flex"><dc-import name="Ikony" iconName="check" size="14" strokeWidth="{{ markStroke }}" hint-size="14px,14px"></dc-import></span>
  </span>
  <span style="{{ labelStyle }}"><sc-if value="{{ noParts }}" hint-placeholder-val="{{ true }}">{{ label }}</sc-if><sc-for list="{{ parts }}" as="pt" hint-placeholder-count="0"><sc-if value="{{ pt.isLink }}" hint-placeholder-val="{{ false }}"><a href="{{ pt.href }}" style="color:var(--ss-link,#296093);text-decoration:underline;text-underline-offset:3px">{{ pt.text }}</a></sc-if><sc-if value="{{ pt.isText }}" hint-placeholder-val="{{ true }}">{{ pt.text }}</sc-if></sc-for></span>
  <sc-if value="{{ showCount }}" hint-placeholder-val="{{ false }}">
    <span style="margin-left:auto;font-size:13px;color:var(--ss-text-muted,#5B6874)">{{ count }}</span>
  </sc-if>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:80},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Skladem&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{text: string, href?: string}[]&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;checked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string | number&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(checked: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      label: p.label ?? 'Skladem',
      noParts: !(p.parts && p.parts.length),
      parts: (p.parts || []).map(x => ({ text: x.text, href: x.href, isLink: !!x.href, isText: !x.href })),
      checked: !!p.checked,
      disabled: !!p.disabled,
      markStroke: 3,
      hoverBg: p.hoverBg ?? 'var(--ss-surface-subtle,#F7F9FB)',
      showCount: p.count !== undefined && p.count !== null && p.count !== '',
      count: p.count,
      rowStyle: p.size === 'compact'
        ? { minHeight: '32px', padding: '0 8px', margin: '0 -8px', gap: '10px' }
        : { minHeight: '44px', padding: '0 8px', margin: '0 -8px' },
      labelStyle: { fontSize: p.size === 'compact' ? '14px' : '15px', color: 'var(--ss-text-primary,#1C2229)', lineHeight: 1.35 },
      handleChange: (e) => { if (p.onChange) p.onChange(e.target.checked); }
    };
  }
}
</script>
</body>
</html>

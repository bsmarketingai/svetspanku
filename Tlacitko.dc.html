<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

.ss-btn{box-sizing:border-box;font-family:Roboto,Helvetica,Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;margin:0;text-decoration:none;cursor:pointer;border-radius:6px;font-weight:600;white-space:nowrap;transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1),border-color .12s cubic-bezier(.22,.61,.36,1),box-shadow .15s cubic-bezier(.22,.61,.36,1),transform .06s cubic-bezier(.22,.61,.36,1);}
.ss-btn{background:var(--b-bg);color:var(--b-fg);box-shadow:var(--b-ring,0 0 0 0 transparent);transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1),box-shadow .15s cubic-bezier(.22,.61,.36,1),transform .15s cubic-bezier(.22,.61,.36,1);}
.ss-btn-ir{display:inline-flex;transition:transform .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){
.ss-btn:not([aria-disabled="true"]):hover{background:var(--b-hbg);color:var(--b-hfg);box-shadow:var(--b-hring,var(--b-ring,0 0 0 0 transparent));}
.ss-btn[data-solid="true"]:not([aria-disabled="true"]):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(19,44,67,.18);}
.ss-btn:not([aria-disabled="true"]):hover .ss-btn-ir{transform:translateX(3px);}
.ss-btn[data-bare="true"]:not([aria-disabled="true"]):hover{text-decoration-thickness:2px;}
}
.ss-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35),var(--b-ring,0 0 0 0 transparent);}
.ss-btn:not([aria-disabled="true"]):active{transform:translateY(0) scale(.98);box-shadow:var(--b-ring,0 0 0 0 transparent);transition-duration:.06s;}
@media (prefers-reduced-motion:reduce){.ss-btn,.ss-btn-ir{transition:background-color .12s,color .12s;}.ss-btn:hover,.ss-btn:active,.ss-btn:hover .ss-btn-ir{transform:none!important;}}
.ss-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
</style>
</helmet>
<sc-if value="{{ isLink }}" hint-placeholder-val="{{ false }}">
  <a class="ss-btn" href="{{ href }}" target="{{ target }}" rel="{{ rel }}" style="{{ btnStyle }}" data-solid="{{ solid }}" data-bare="{{ bare }}" aria-label="{{ ariaLabel }}">
    <sc-if value="{{ hasIconLeft }}" hint-placeholder-val="{{ false }}"><dc-import name="Ikony" iconName="{{ iconLeft }}" size="{{ iconSize }}" hint-size="20px,20px"></dc-import></sc-if>
    <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="display:flex;flex-direction:column;align-items:center;line-height:1.2"><span>{{ label }}</span><sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:500">{{ sublabel }}</span></sc-if></span></sc-if>
    <sc-if value="{{ hasIconRight }}" hint-placeholder-val="{{ false }}"><span class="ss-btn-ir"><dc-import name="Ikony" iconName="{{ iconRight }}" size="{{ iconSize }}" hint-size="20px,20px"></dc-import></span></sc-if>
  </a>
</sc-if>
<sc-if value="{{ isButton }}" hint-placeholder-val="{{ true }}">
  <button type="button" class="ss-btn" style="{{ btnStyle }}" data-solid="{{ solid }}" data-bare="{{ bare }}" onClick="{{ handleClick }}" aria-label="{{ ariaLabel }}" aria-disabled="{{ ariaDisabled }}">
    <sc-if value="{{ hasIconLeft }}" hint-placeholder-val="{{ false }}"><dc-import name="Ikony" iconName="{{ iconLeft }}" size="{{ iconSize }}" hint-size="20px,20px"></dc-import></sc-if>
    <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="display:flex;flex-direction:column;align-items:center;line-height:1.2"><span>{{ label }}</span><sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:500">{{ sublabel }}</span></sc-if></span></sc-if>
    <sc-if value="{{ hasIconRight }}" hint-placeholder-val="{{ false }}"><span class="ss-btn-ir"><dc-import name="Ikony" iconName="{{ iconRight }}" size="{{ iconSize }}" hint-size="20px,20px"></dc-import></span></sc-if>
  </button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:120},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Do košíku&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;primary&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;secondary&quot;,&quot;buy&quot;,&quot;danger&quot;,&quot;dangerSecondary&quot;,&quot;ghost&quot;,&quot;text&quot;,&quot;textDanger&quot;,&quot;ontint&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;medium&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;medium&quot;,&quot;large&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;iconLeft&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ikony&quot;},&quot;iconRight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ikony&quot;},&quot;iconOnly&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ikony&quot;},&quot;ariaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ikony&quot;},&quot;sublabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fullWidth&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  static VARIANTS = {
    primary:         { bg: '#296093', fg: '#FFFFFF', hoverBg: '#21507B' },
    secondary:       { bg: 'var(--ss-action-tonal-bg,#FEEDD4)', fg: 'var(--ss-action-tonal-fg,#7A4708)', hoverBg: 'var(--ss-action-tonal-hover-bg,#FDDCAA)', hoverFg: 'var(--ss-action-tonal-hover-fg,#7A4708)' },
    buy:             { bg: '#FBB255', fg: '#1C2229', hoverBg: '#F09A2C' },
    danger:          { bg: '#B3261E', fg: '#FFFFFF', hoverBg: '#8E1E18' },
    dangerSecondary: { bg: 'var(--ss-surface-page,#FEFAF7)', fg: 'var(--ss-status-error,#B3261E)', hoverBg: 'var(--ss-status-error-surface,#FCF2F1)', border: '1px solid var(--ss-border-error-subtle,#E3B9B6)', hoverBorder: '1px solid var(--ss-border-error,#B3261E)' },
    ghost:           { bg: 'transparent', fg: 'var(--ss-link-hover,#21507B)', hoverBg: 'var(--ss-surface-hover,#F0F5FA)' },
    text:            { bg: 'transparent', fg: 'var(--ss-link,#296093)', hoverBg: 'transparent', hoverFg: 'var(--ss-link-hover,#21507B)', bare: true, underline: true },
    textDanger:      { bg: 'transparent', fg: 'var(--ss-status-error,#B3261E)', hoverBg: 'transparent', hoverFg: 'var(--ss-status-error-strong,#8E1E18)', bare: true, underline: true },
    ontint:          { bg: 'rgba(255,255,255,.14)', fg: '#FFFFFF', hoverBg: 'rgba(255,255,255,.26)', border: '1px solid rgba(255,255,255,.55)' }
  };
  static SIZES = {
    standard: { h: 36, pad: 14, font: 14, icon: 18 },
    medium:   { h: 44, pad: 20, font: 15, icon: 20 },
    large:    { h: 52, pad: 28, font: 16, icon: 20 }
  };
  renderVals() {
    const p = this.props;
    const v = Component.VARIANTS[p.variant] || Component.VARIANTS.primary;
    const s = Component.SIZES[p.size] || Component.SIZES.medium;
    const label = p.label ?? 'Tlačítko';
    const iconOnly = !!p.iconOnly;
    const disabled = !!p.disabled;
    const hasLabel = !iconOnly && !!label;
    const padX = v.bare ? 0 : (iconOnly ? 0 : s.pad);
    const btnStyle = {
      height: v.bare || p.sublabel ? 'auto' : s.h + 'px',
      minHeight: p.sublabel ? (s.h + 8) + 'px' : undefined,
      paddingTop: p.sublabel ? '8px' : undefined, paddingBottom: p.sublabel ? '8px' : undefined,
      width: iconOnly ? s.h + 'px' : (p.fullWidth ? '100%' : undefined),
      minWidth: iconOnly ? s.h + 'px' : undefined,
      paddingLeft: padX + 'px', paddingRight: padX + 'px',
      fontSize: s.font + 'px',
      '--b-bg': v.bg,
      '--b-fg': v.fg,
      '--b-hbg': v.hoverBg,
      '--b-hfg': v.hoverFg || v.fg,
      '--b-ring': v.border ? 'inset 0 0 0 1px ' + v.border.split(' ').slice(2).join(' ') : undefined,
      '--b-hring': v.hoverBorder ? 'inset 0 0 0 1px ' + v.hoverBorder.split(' ').slice(2).join(' ') : undefined,
      borderRadius: v.bare ? '4px' : '6px',
      textDecoration: v.underline ? 'underline' : 'none',
      textUnderlineOffset: v.underline ? '3px' : undefined
    };
    const solid = ['primary', 'buy', 'danger'].indexOf(p.variant || 'primary') >= 0 ? 'true' : 'false';
    const bare = v.bare ? 'true' : 'false';
    return {
      isLink: !!p.href && !disabled,
      isButton: !(p.href && !disabled),
      href: p.href || '#',
      target: p.newTab ? '_blank' : undefined,
      rel: p.newTab ? 'noopener noreferrer' : undefined,
      label, hasLabel, hasSub: !!p.sublabel, sublabel: p.sublabel,
      hasIconLeft: iconOnly ? !!(p.iconLeft || p.iconRight) : !!p.iconLeft,
      iconLeft: iconOnly ? (p.iconLeft || p.iconRight) : p.iconLeft,
      hasIconRight: !iconOnly && !!p.iconRight,
      iconRight: p.iconRight,
      iconSize: s.icon,
      ariaLabel: iconOnly ? (p.ariaLabel || label) : (p.ariaLabel || undefined),
      ariaDisabled: disabled ? 'true' : undefined,
      btnStyle, solid, bare,
      handleClick: disabled ? (e) => e.preventDefault() : (p.onClick || (() => {}))
    };
  }
}
</script>
</body>
</html>

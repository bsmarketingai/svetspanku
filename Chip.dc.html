<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,400..700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

.ss-chip{font-family:Roboto,Helvetica,Arial,sans-serif;display:inline-flex;align-items:center;gap:8px;border:0;margin:0;background:none;text-decoration:none;cursor:pointer;border-radius:999px;font-weight:600;white-space:nowrap;transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1),box-shadow .15s cubic-bezier(.22,.61,.36,1),transform .06s cubic-bezier(.22,.61,.36,1);}
.ss-chip:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-chip:not([aria-disabled="true"]):active{transform:scale(.98);}
.ss-chip[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
.ss-chip-st{display:inline-grid;justify-items:center;}
.ss-chip-st>span{grid-area:1/1;font-family:'Roboto Flex',Roboto,sans-serif;font-optical-sizing:auto;}
.ss-chip-st-size{visibility:hidden;font-variation-settings:'wdth' 151;}
.ss-chip-st-anim{font-variation-settings:'wdth' 100;animation:ss-chip-wdth 2.8s cubic-bezier(.65,0,.35,1) infinite;}
@keyframes ss-chip-wdth{0%,100%{font-variation-settings:'wdth' 100;}30%{font-variation-settings:'wdth' 151;}45%{font-variation-settings:'wdth' 151;}75%{font-variation-settings:'wdth' 30;}88%{font-variation-settings:'wdth' 30;}}
@media (prefers-reduced-motion:reduce){.ss-chip-st-anim{animation:none;}}
</style>
</helmet>
<sc-if value="{{ isLink }}" hint-placeholder-val="{{ false }}">
  <a class="ss-chip" href="{{ href }}" style="{{ chipStyle }}" style-hover="{{ hoverStyle }}">
    <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><dc-import name="Ikony" iconName="{{ icon }}" size="{{ iconSize }}" hint-size="18px,18px"></dc-import></sc-if>
    <span>{{ label }}</span>
    <sc-if value="{{ showCount }}" hint-placeholder-val="{{ false }}"><span style="{{ countStyle }}">{{ count }}</span></sc-if>
  </a>
</sc-if>
<sc-if value="{{ isButton }}" hint-placeholder-val="{{ true }}">
  <button type="button" class="ss-chip" style="{{ chipStyle }}" style-hover="{{ hoverStyle }}" onClick="{{ handleClick }}" aria-pressed="{{ ariaPressed }}" aria-disabled="{{ ariaDisabled }}">
    <sc-if value="{{ showCheck }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;border-radius:999px;background:#FBB255;color:#1C2229"><dc-import name="Ikony" iconName="check" size="14" hint-size="14px,14px"></dc-import></span></sc-if>
    <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><dc-import name="Ikony" iconName="{{ icon }}" size="{{ iconSize }}" hint-size="18px,18px"></dc-import></sc-if>
    <sc-if value="{{ plainLabel }}" hint-placeholder-val="{{ true }}"><span>{{ label }}</span></sc-if>
    <sc-if value="{{ stretch }}" hint-placeholder-val="{{ false }}"><span class="ss-chip-st"><span class="ss-chip-st-size" aria-hidden="true">{{ label }}</span><span class="ss-chip-st-anim">{{ label }}</span></span></sc-if>
    <sc-if value="{{ showCount }}" hint-placeholder-val="{{ false }}"><span style="{{ countStyle }}">{{ count }}</span></sc-if>
    <sc-if value="{{ showRemove }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;margin-right:-2px"><dc-import name="Ikony" iconName="x" size="{{ iconSize }}" hint-size="18px,18px"></dc-import></span></sc-if>
  </button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:100},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Matrace&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;filter&quot;,&quot;options&quot;:[&quot;filter&quot;,&quot;primary&quot;,&quot;secondary&quot;,&quot;secondaryOutline&quot;,&quot;outline&quot;,&quot;sale&quot;,&quot;accent&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;small&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string | number&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;stretch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;check&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  static VARIANTS = {
    filter:          { bg: 'var(--ss-surface-page,#FFFFFF)', fg: 'var(--ss-text-secondary,#3D4750)', border: 'var(--ss-border-strong,#C8D0D8)', hoverBg: 'var(--ss-hover-bg,#FFF5E6)', hoverFg: 'var(--ss-hover-text,#A4600C)', hoverBorder: 'var(--ss-hover-text,#A4600C)' },
    filterActive:    { bg: '#296093', fg: '#FFFFFF', hoverBg: '#21507B' },
    primary:         { bg: '#296093', fg: '#FFFFFF', hoverBg: '#21507B' },
    secondary:       { bg: 'var(--ss-surface-hover,#F0F5FA)', fg: 'var(--ss-link-hover,#21507B)', hoverBg: 'var(--ss-hover-bg,#FFF5E6)', hoverFg: 'var(--ss-hover-text,#A4600C)' },
    secondaryOutline:{ bg: 'var(--ss-surface-page,#FFFFFF)', fg: 'var(--ss-link-hover,#21507B)', border: 'var(--ss-border-hover,#8DB3D3)', hoverBg: 'var(--ss-hover-bg,#FFF5E6)', hoverFg: 'var(--ss-hover-text,#A4600C)', hoverBorder: 'var(--ss-hover-text,#A4600C)' },
    outline:         { bg: 'var(--ss-surface-page,#FFFFFF)', fg: 'var(--ss-text-secondary,#3D4750)', border: 'var(--ss-border-strong,#C8D0D8)', hoverBg: 'var(--ss-hover-bg,#FFF5E6)', hoverFg: 'var(--ss-hover-text,#A4600C)', hoverBorder: 'var(--ss-hover-text,#A4600C)' },
    sale:            { bg: '#B3261E', fg: '#FFFFFF', hoverBg: '#8E1E18' },
    accent:          { bg: '#FBB255', fg: '#1C2229', hoverBg: '#F09A2C' }
  };
  static SIZES = { standard: { h: 40, pad: 18, font: 14, icon: 18 }, small: { h: 32, pad: 14, font: 13, icon: 16 } };
  renderVals() {
    const p = this.props;
    const active = !!p.active;
    const key = p.variant === 'filter' && active ? 'filterActive' : (p.variant || 'filter');
    const v = Component.VARIANTS[key] || Component.VARIANTS.filter;
    const s = Component.SIZES[p.size] || Component.SIZES.standard;
    const disabled = !!p.disabled;
    const showCheck = p.check === true || p.check === 'true';
    const chipStyle = {
      height: s.h + 'px', padding: '0 ' + s.pad + 'px 0 ' + (showCheck ? 9 : s.pad) + 'px', fontSize: s.font + 'px',
      background: v.bg, color: v.fg,
      boxShadow: v.border ? 'inset 0 0 0 1px ' + v.border : undefined
    };
    const hoverStyle = disabled ? {} : {
      background: v.hoverBg, color: v.hoverFg || v.fg, boxShadow: v.hoverBorder ? 'inset 0 0 0 1px ' + v.hoverBorder : chipStyle.boxShadow
    };
    return {
      isLink: !!p.href && !disabled,
      isButton: !(p.href && !disabled),
      href: p.href || '#',
      label: p.label ?? 'Chip',
      stretch: !!p.stretch, plainLabel: !p.stretch,
      hasIcon: !!p.icon, icon: p.icon, iconSize: s.icon,
      showCount: p.count !== undefined && p.count !== null && p.count !== '',
      count: p.count,
      countStyle: { fontSize: s.font - 1 + 'px', fontWeight: 500, opacity: .75 },
      showCheck,
      showRemove: p.variant === 'filter' && active && !p.href,
      ariaPressed: p.ariaPressed || (p.variant === 'filter' ? (active ? 'true' : 'false') : undefined),
      ariaDisabled: disabled ? 'true' : undefined,
      chipStyle, hoverStyle,
      handleClick: disabled ? (e) => e.preventDefault() : (p.onClick || (() => {}))
    };
  }
}
</script>
</body>
</html>

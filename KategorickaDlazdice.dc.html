<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Archivo,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:800!important;font-stretch:75%;text-transform:uppercase;letter-spacing:-0.005em;}

.ss-ct{font-family:Archivo,Helvetica,Arial,sans-serif;position:relative;display:flex;background:#FFFFFF;border-radius:12px;text-decoration:none;color:#1C2229;min-width:0;transition:box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.ss-ct:hover{box-shadow:0 4px 12px rgba(19,44,67,.12);}
.ss-ct:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-ct-title{transition:color .12s cubic-bezier(.22,.61,.36,1);}
.ss-ct:hover .ss-ct-title{color:#296093;}
.ss-ct-media{position:relative;overflow:hidden;background:#FFFFFF;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#C8D0D8;}
.ss-ct-img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .4s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-ct:hover .ss-ct-img{transform:scale(1.06);}}
@media (prefers-reduced-motion:reduce){.ss-ct-img{transition:none;}.ss-ct:hover .ss-ct-img{transform:none;}}
</style>
</helmet>
<a class="ss-ct" href="{{ href }}" style="{{ wrapStyle }}">
  <sc-if value="{{ isStandard }}" hint-placeholder-val="{{ true }}">
    <span style="display:flex;flex-direction:column;gap:12px;width:100%;min-width:0">
      <span class="ss-ct-media" style="width:100%;aspect-ratio:4/3">
        <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}">
          <img class="ss-ct-img" src="{{ image }}" alt="" aria-hidden="true" />
        </sc-if>
        <sc-if value="{{ noImage }}" hint-placeholder-val="{{ true }}">
          <dc-import name="Ikony" iconName="photo" size="28" hint-size="28px,28px"></dc-import>
        </sc-if>
      </span>
      <span style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <span class="ss-ct-title" style="font-family:'Archivo Narrow',Archivo,sans-serif;font-weight:700;font-size:17px;line-height:1.25">{{ label }}</span>
        <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:13px;color:#5B6874;line-height:1.45">{{ subText }}</span>
        </sc-if>
        <sc-if value="{{ hasCount }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:13px;font-weight:600;color:#21507B">{{ countText }}</span>
        </sc-if>
      </span>
    </span>
  </sc-if>
  <sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
    <span style="display:flex;align-items:center;gap:12px;width:100%;min-width:0">
      <span class="ss-ct-media" style="width:48px;height:48px;flex:none">
        <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}">
          <img class="ss-ct-img" src="{{ image }}" alt="" aria-hidden="true" />
        </sc-if>
        <sc-if value="{{ noImage }}" hint-placeholder-val="{{ true }}">
          <dc-import name="Ikony" iconName="photo" size="20" hint-size="20px,20px"></dc-import>
        </sc-if>
      </span>
      <span class="ss-ct-title" style="font-size:15px;font-weight:600;line-height:1.35;min-width:0">{{ label }}</span>
      <sc-if value="{{ hasCount }}" hint-placeholder-val="{{ true }}">
        <span style="margin-left:auto;font-size:13px;color:#5B6874;white-space:nowrap">{{ count }}</span>
      </sc-if>
    </span>
  </sc-if>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:300},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Manželské postele z masivu&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;kompaktni&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:42,&quot;min&quot;:0,&quot;max&quot;:999,&quot;tsType&quot;:&quot;number&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#kategorie&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;kategorie-manzelske-postele.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const compact = p.variant === 'kompaktni';
    const sub = p.sub || [];
    const count = p.count;
    return {
      href: p.href || '#kategorie',
      image: p.image,
      hasImage: !!p.image,
      noImage: !p.image,
      label: p.label || 'Manželské postele z masivu',
      isStandard: !compact,
      isCompact: compact,
      hasSub: !compact && sub.length > 0,
      subText: sub.join(' · '),
      hasCount: count !== undefined && count !== null && count !== '',
      count,
      countText: count + ' produktů',
      wrapStyle: { padding: compact ? '12px' : '16px' }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Archivo,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:800!important;font-stretch:75%;text-transform:uppercase;letter-spacing:-0.005em;}

.ss-select-wrap{font-family:Archivo,Helvetica,Arial,sans-serif;display:inline-flex;flex-direction:column;gap:6px;min-width:0;}
.ss-select-field{position:relative;display:flex;align-items:center;min-width:0;}
.ss-select{appearance:none;-webkit-appearance:none;font-family:inherit;font-weight:500;color:#1C2229;width:100%;min-width:0;border:0;border-radius:6px;cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1),box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.ss-select:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35),inset 0 0 0 1px #296093;}
.ss-select:disabled{opacity:.45;cursor:not-allowed;}
.ss-select-arrow{position:absolute;right:12px;display:flex;pointer-events:none;color:#55616C;}
@media (max-width:549px){.ss-select{font-size:16px!important;}}
</style>
</helmet>
<div class="ss-select-wrap" style="{{ wrapStyle }}">
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ false }}">
    <label style="font-size:13px;font-weight:600;color:#3D4750" for="{{ id }}">{{ label }}</label>
  </sc-if>
  <div class="ss-select-field">
    <select class="ss-select" id="{{ id }}" style="{{ selectStyle }}" style-hover="{{ hoverStyle }}" value="{{ value }}" onChange="{{ handleChange }}" disabled="{{ disabled }}" aria-label="{{ ariaLabel }}">
      <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
        <option value="{{ o.value }}">{{ o.label }}</option>
      </sc-for>
    </select>
    <span class="ss-select-arrow"><dc-import name="Ikony" iconName="chevron-down" size="18" hint-size="18px,18px"></dc-import></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:120},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Řadit podle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;subtle&quot;,&quot;options&quot;:[&quot;subtle&quot;,&quot;outline&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;standard&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fullWidth&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{value: string, label: string}[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const compact = p.size === 'compact';
    const h = compact ? 36 : 44;
    const outline = p.variant === 'outline';
    const options = (p.options && p.options.length ? p.options : [
      { value: 'doporucene', label: 'Doporučené' },
      { value: 'nejlevnejsi', label: 'Od nejlevnějšího' },
      { value: 'nejdrazsi', label: 'Od nejdražšího' },
      { value: 'novinky', label: 'Novinky' }
    ]).map(o => (typeof o === 'string' ? { value: o, label: o } : o));
    return {
      id: p.id || ('ss-select-' + (this._id || (this._id = Math.random().toString(36).slice(2, 8)))),
      hasLabel: !!p.label,
      label: p.label,
      ariaLabel: p.label ? undefined : (p.ariaLabel || 'Výběr'),
      options,
      value: p.value ?? options[0].value,
      disabled: !!p.disabled,
      wrapStyle: { width: p.fullWidth ? '100%' : undefined },
      selectStyle: {
        height: h + 'px', fontSize: (compact ? 14 : 15) + 'px',
        padding: '0 38px 0 ' + (compact ? 12 : 14) + 'px',
        background: outline ? '#FFFFFF' : '#F7F9FB',
        boxShadow: 'inset 0 0 0 1px ' + (outline ? '#C8D0D8' : 'transparent')
      },
      hoverStyle: p.disabled ? {} : { background: outline ? '#F7F9FB' : '#EFF2F5', boxShadow: 'inset 0 0 0 1px ' + (outline ? '#8DB3D3' : 'transparent') },
      handleChange: (e) => { if (p.onChange) p.onChange(e.target.value); }
    };
  }
}
</script>
</body>
</html>

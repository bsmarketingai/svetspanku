<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
html,body{margin:0!important;padding:0!important;}
#dc-root{margin:0!important;padding:0!important;width:100%!important;max-width:none!important;border:0!important;}
#dc-root>.sc-host{margin:0!important;padding:0!important;width:100%!important;}
a{color:var(--ss-link,#296093);}
a:hover{color:var(--ss-hover-text,#21507B);}
</style>
</helmet>
<div style="width:100%;background:var(--ss-surface-page,#FEFAF7);font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1C2229)">
  <dc-import name="Hlavicka" style="position:sticky;top:0;z-index:200" ledMode="{{ ledMode }}" hint-size="100%,180px"></dc-import>
  <dc-import name="PrezentacniLista" items="{{ presItems }}" onToggle="{{ onPresToggle }}" hint-size="320px,52px"></dc-import>

  <main>
    <dc-import name="KrokyObjednavky" active="{{ 1 }}" hint-size="100%,80px"></dc-import>

    <section style="width:100%">
      <div style="{{ inner }}">
        <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Váš košík</h1>

        <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column">
            <sc-for list="{{ items }}" as="i" hint-placeholder-count="2">
              <dc-import name="PolozkaKosiku" item="{{ i.data }}" layout="{{ layout }}" onQty="{{ i.onQty }}" onRemove="{{ i.onRemove }}" hint-size="100%,144px"></dc-import>
            </sc-for>
          </div>

          <div style="display:grid;grid-template-columns:{{ bottomCols }};gap:{{ bottomGap }};align-items:start;padding-top:32px">
            <div style="display:flex;flex-direction:column;gap:32px;min-width:0;height:100%">
              <dc-import name="SlevovyKupon" applied="{{ coupon }}" onApply="{{ onApply }}" onRemove="{{ onRemoveCoupon }}" hint-size="100%,44px"></dc-import>
              <sc-if value="{{ backInLeft }}" hint-placeholder-val="{{ true }}">
                <div style="margin-top:auto"><dc-import name="Tlacitko" label="Zpět do obchodu" variant="secondary" size="large" href="index.dc.html" iconLeft="arrow-left" hint-size="220px,52px"></dc-import></div>
              </sc-if>
            </div>
            <div style="min-width:0">
              <dc-import name="DopravaZdarma" total="{{ totalNum }}" threshold="{{ threshold }}" hint-size="100%,140px"></dc-import>
            </div>
            <div style="{{ summaryWrap }}">
              <dc-import name="SouhrnKosiku" total="{{ total }}" totalNoVat="{{ totalNoVat }}" discount="{{ discount }}" flush="{{ flush }}" ctaLabel="Pokračovat k dopravě a platbě" ctaHref="KosikKrok2.dc.html" hint-size="100%,240px"></dc-import>
            </div>
            <sc-if value="{{ backBelow }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;justify-content:center"><dc-import name="Tlacitko" label="Zpět do obchodu" variant="secondary" size="large" href="index.dc.html" iconLeft="arrow-left" hint-size="220px,52px"></dc-import></div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <dc-import name="PrazdnyStav" icon="shopping-bag" title="Košík je prázdný" text="Vyberte postel, matraci nebo rošt. Když si nevíte rady, projděte průvodce výběrem nebo nám zavolejte na +420 543 212 855." suggestions="{{ emptySuggestions }}" primaryLabel="Zpět do obchodu" onPrimary="{{ goShop }}" hint-size="100%,320px"></dc-import>
        </sc-if>
      </div>
    </section>

    <section style="width:100%">
      <div style="{{ innerReco }}">
        <dc-import name="SouvisejiciProdukty" heading="Udělejte si radost" navPosition="peek" hint-size="100%,560px"></dc-import>
      </div>
    </section>
  </main>

  <footer style="width:100%;background:var(--ss-surface-subtle,#FAF5EF);border-top:1px solid var(--ss-border-subtle,#E1E6EB)">
    <div style="{{ innerFoot }}">
      <span style="font-size:13px;color:var(--ss-text-muted,#5B6874);text-align:center">Copyright © 2026 LUCKÉ CZ GROUP s.r.o. — Všechna práva vyhrazena</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1400}}">
class Component extends DCLogic {
  state = {
    width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440,
    led: true, coupon: '',
    items: [
      { title: 'Manželská postel SANTE 45 dvoulůžko', variant: '200 × 180 cm · olej Teak · jádrový buk', qty: 2, unit: 19990, before: 24990, img: 'produkt-sante-45.jpg', fit: 'cover', stock: 'inStock' },
      { title: 'Matrace Spring Variant 22 cm', variant: '180 × 200 cm · tuhost H3', qty: 1, unit: 7590, before: 9590, img: 'produkt-matrace-spring-variant.png', stock: 'inStock' }
    ]
  };
  componentDidMount() {
    this._r = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + '\u00A0Kč'; }
  renderVals() {
    const w = this.state.width;
    const narrow = w < 820;
    const wide = w >= 1000;
    const items = this.state.items;
    const sum = items.reduce((s, i) => s + i.unit * i.qty, 0);
    const COUPONS = { SPANEK10: 0.10 };
    const rate = COUPONS[this.state.coupon] || 0;
    const disc = Math.round(sum * rate);
    const total = sum - disc;
    const pad = narrow ? '16px' : '32px';
    return {
      ledMode: this.state.led ? 'on' : 'off',
      presItems: [{ label: 'LED', value: this.state.led }],
      onPresToggle: () => this.setState(s => ({ led: !s.led })),
      inner: { maxWidth: '1560px', margin: '0 auto', boxSizing: 'border-box', padding: (narrow ? '8px ' : '24px ') + pad + (narrow ? ' 32px' : ' 64px') },
      innerReco: { maxWidth: '1560px', margin: '0 auto', boxSizing: 'border-box', padding: '0 ' + pad + (narrow ? ' 64px' : ' 96px') },
      innerFoot: { maxWidth: '1560px', margin: '0 auto', boxSizing: 'border-box', padding: '16px ' + pad, display: 'flex', justifyContent: 'center' },
      layout: wide ? 'row' : 'stack',
      hasItems: items.length > 0, isEmpty: items.length === 0,
      items: items.map((it, idx) => ({
        data: { title: it.title, variant: it.variant, qty: it.qty, img: it.img, fit: it.fit, stock: it.stock,
          unitPrice: this.fmt(it.unit), priceBefore: it.before ? this.fmt(it.before) : undefined, total: this.fmt(it.unit * it.qty) },
        onQty: (v) => this.setState(s => ({ items: s.items.map((x, j) => j === idx ? Object.assign({}, x, { qty: v }) : x) })),
        onRemove: () => this.setState(s => ({ items: s.items.filter((x, j) => j !== idx) }))
      })),
      bottomCols: wide ? 'minmax(0,1fr) minmax(0,1fr) minmax(360px,440px)' : 'minmax(0,1fr)',
      bottomGap: wide ? '32px' : '24px',
      summaryWrap: { minWidth: 0 },
      flush: false,
      backInLeft: wide, backBelow: !wide,
      coupon: this.state.coupon,
      onApply: (code) => { if (COUPONS[code] === undefined) return false; this.setState({ coupon: code }); return true; },
      onRemoveCoupon: () => this.setState({ coupon: '' }),
      discount: disc ? '−' + this.fmt(disc) : '',
      totalNum: total, threshold: 50000,
      total: this.fmt(total),
      totalNoVat: this.fmt(total / 1.21),
      emptySuggestions: [{ label: 'Postele z masivu', href: 'Kategorie.dc.html' }, { label: 'Matrace', href: 'Kategorie.dc.html' }, { label: 'Rošty', href: 'Kategorie.dc.html' }],
      goShop: () => { window.location.href = 'index.dc.html'; }
    };
  }
}
</script>
</body>
</html>

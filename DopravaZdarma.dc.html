<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
</style>
</helmet>
<div style="font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1C2229);display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:start;width:100%;max-width:440px">
  <span style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;background:var(--ss-surface-hover,#F0F5FA);color:var(--ss-link,#296093)"><dc-import name="Ikony" iconName="truck" size="24" hint-size="24px,24px"></dc-import></span>
  <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
    <p style="margin:0;font-size:15px;line-height:1.5;color:var(--ss-text-secondary,#3D4750);text-wrap:pretty">Vybrané zboží vám dovezeme a&nbsp;rádi i&nbsp;smontujeme. Druh dopravy a&nbsp;montáž si vyberete v&nbsp;dalším kroku.</p>
    <sc-if value="{{ showBar }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:8px">
        <div role="progressbar" aria-label="Doprava zdarma" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pct }}" style="height:8px;border-radius:999px;background:var(--ss-surface-muted,#F3EDE4);overflow:hidden">
          <div style="height:100%;width:{{ pctCss }};border-radius:999px;background:{{ barColor }};transition:width .4s cubic-bezier(.22,.61,.36,1),background-color .12s cubic-bezier(.22,.61,.36,1)"></div>
        </div>
        <sc-if value="{{ reached }}" hint-placeholder-val="{{ false }}">
          <span style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ss-status-success,#157A41)"><dc-import name="Ikony" iconName="circle-check" size="20" hint-size="20px,20px"></dc-import>Dopravu máte od nás zdarma</span>
        </sc-if>
        <sc-if value="{{ notReached }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:15px;line-height:1.4;color:var(--ss-text-primary,#1C2229)">Nakupte ještě za <strong style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:16px;white-space:nowrap">{{ remaining }}</strong> a&nbsp;dopravu máte zdarma.</span>
        </sc-if>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:160},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:47570,&quot;min&quot;:0,&quot;max&quot;:200000,&quot;tsType&quot;:&quot;number&quot;},&quot;threshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:50000,&quot;min&quot;:0,&quot;max&quot;:200000,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const total = Number(p.total ?? 47570);
    const thr = Number(p.threshold ?? 50000);
    const left = Math.max(0, thr - total);
    const pct = thr > 0 ? Math.min(100, Math.round(total / thr * 100)) : 100;
    const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + '\u00A0Kč';
    return {
      showBar: thr > 0,
      pct, pctCss: pct + '%',
      reached: left === 0, notReached: left > 0,
      remaining: fmt(left),
      barColor: left === 0 ? 'var(--ss-status-success,#157A41)' : '#296093'
    };
  }
}
</script>
</body>
</html>

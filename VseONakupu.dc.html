<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
html,body{margin:0!important;padding:0!important;}
#dc-root{margin:0!important;padding:0!important;width:100%!important;max-width:none!important;border:0!important;}
#dc-root>.sc-host{margin:0!important;padding:0!important;width:100%!important;}
a{color:var(--ss-link,#296093);}
a:hover{color:var(--ss-hover-text,#21507B);}
.ss-vn{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:24px;border-radius:12px;background:var(--ss-surface-card,#FFFFFF);box-shadow:0 2px 8px rgba(19,44,67,.08);text-decoration:none;color:var(--ss-text-primary,#1C2229);transition:box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.ss-vn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-vn-t{display:flex;align-items:flex-start;gap:8px;font-family:Oswald,Helvetica,Arial,sans-serif;font-weight:600;font-size:20px;line-height:1.25;color:var(--ss-text-heading,#0B1F33);transition:color .12s cubic-bezier(.22,.61,.36,1);}
.ss-vn-c{display:flex;flex:none;margin-top:2px;color:var(--ss-link,#296093);transition:transform .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-vn:hover{box-shadow:0 4px 12px rgba(19,44,67,.12);}.ss-vn:hover .ss-vn-t{color:var(--ss-hover-text,#21507B);}.ss-vn:hover .ss-vn-c{transform:translateX(2px);}}
</style>
</helmet>
<div style="width:100%;background:var(--ss-surface-page,#FFFFFF);font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1C2229)">
  <dc-import name="Hlavicka" style="position:sticky;top:0;z-index:200" ledMode="{{ ledMode }}" hint-size="100%,180px"></dc-import>
  <dc-import name="PrezentacniLista" items="{{ presItems }}" onToggle="{{ onPresToggle }}" hint-size="320px,52px"></dc-import>

  <main>
    <section class="ss-grad-top ss-grad-glow" style="width:100%;background-color:var(--ss-surface-page,#FFFFFF)">
      <div style="{{ innerTop }}">
        <dc-import name="Drobeckova" items="{{ crumbs }}" hint-size="100%,56px"></dc-import>
        <h1 style="{{ h1Style }}">Vše o nákupu</h1>
        <nav aria-label="Vše o nákupu" style="{{ gridStyle }}">
          <sc-for list="{{ cards }}" as="c" hint-placeholder-count="8">
            <a class="ss-vn" href="{{ c.href }}">
              <span class="ss-vn-t"><span>{{ c.title }}</span><span class="ss-vn-c"><dc-import name="Ikony" iconName="chevron-right" size="20" hint-size="20px,20px"></dc-import></span></span>
              <span style="font-size:14px;line-height:1.55;color:var(--ss-text-secondary,#3D4750);text-wrap:pretty">{{ c.text }}</span>
            </a>
          </sc-for>
        </nav>
      </div>
    </section>

    <section style="width:100%">
      <div style="{{ innerFaq }}">
        <dc-import name="Faq" items="{{ faqs }}" narrow="{{ narrow }}" idPrefix="vn-faq" moreText="Nenašli jste odpověď? Zavolejte nám na" moreLabel="+420 543 212 855" moreHref="tel:+420543212855" hint-size="100%,260px"></dc-import>
      </div>
    </section>

    <section class="ss-grad-top ss-grad-glow" style="width:100%;background-color:var(--ss-surface-page,#FFFFFF)">
      <div style="{{ innerNews }}">
        <dc-import name="Newsletter" narrow="{{ narrowNews }}" hint-size="100%,160px"></dc-import>
      </div>
    </section>
  </main>

  <dc-import name="Paticka" ledMode="{{ ledMode }}" hint-size="100%,700px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1600}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440, led: true };
  componentDidMount() { this._r = () => this.setState({ width: document.documentElement.clientWidth }); window.addEventListener('resize', this._r); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const w = this.state.width, narrow = w < 820;
    const pad = narrow ? '16px' : '32px';
    const box = (t, b) => ({ maxWidth: '1560px', margin: '0 auto', boxSizing: 'border-box', padding: t + ' ' + pad + ' ' + b });
    const cols = w >= 1150 ? 4 : w >= 550 ? 2 : 1;
    return {
      ledMode: this.state.led ? 'on' : 'off',
      presItems: [{ label: 'LED', value: this.state.led }],
      onPresToggle: () => this.setState(s => ({ led: !s.led })),
      narrow, narrowNews: w < 1000,
      crumbs: [{ label: 'Domů', href: 'index.dc.html' }, { label: 'O nás', href: 'ONas.dc.html' }, { label: 'Vše o nákupu' }],
      h1Style: { margin: narrow ? '8px 0 32px' : '16px 0 48px', fontSize: narrow ? '28px' : '40px', lineHeight: 1.15 },
      innerTop: box(narrow ? '8px' : '16px', narrow ? '48px' : '64px'),
      innerFaq: box(narrow ? '48px' : '64px', narrow ? '48px' : '80px'),
      innerNews: box(narrow ? '40px' : '64px', narrow ? '40px' : '64px'),
      gridStyle: { display: 'grid', gridTemplateColumns: 'repeat(' + cols + ',minmax(0,1fr))', gap: '20px' },
      cards: [
        { title: 'Informace o stavu vaší objednávky', text: 'Kde je vaše zásilka a kdy dorazí. Stačí číslo objednávky a e-mail.', href: '#stav-objednavky' },
        { title: 'Vrácení zboží a reklamace', text: 'Formulář pro odstoupení od smlouvy do 14 dnů a postup reklamace.', href: '#vraceni-zbozi' },
        { title: 'Platba', text: 'Kartou, převodem, QR kódem, na splátky i hotově na prodejně.', href: '#platba' },
        { title: 'Doprava', text: 'Vlastní doprava s vynáškou, PPL, Zásilkovna nebo osobní odběr.', href: '#doprava' },
        { title: 'Obchodní podmínky', text: 'Pravidla nákupu, záruky a práva spotřebitele.', href: '#obchodni-podminky' },
        { title: 'GDPR', text: 'Jak zpracováváme a chráníme vaše osobní údaje.', href: '#ochrana-osobnich-udaju' },
        { title: 'Kontakty', text: 'Zákaznická linka Po–Pá 9:00–17:00, e-mail a fakturační údaje.', href: '#kontakty' },
        { title: 'Prodejny', text: 'Vyzkoušejte si postele a matrace osobně na některé z našich prodejen.', href: '#prodejny' }
      ],
      faqs: [
        { question: 'Jak funguje 90 dní na vyzkoušení?', answer: 'Matraci si doma vyzkoušíte 90 nocí. Když vám nesedne, ozvěte se nám, vyzvedneme ji a vrátíme peníze, nebo ji vyměníme za jinou tuhost.' },
        { question: 'Je možné vyrobit matraci na míru?', answer: 'Ano. Matrace vyrábíme v rozměrech od 70 × 180 cm po 200 × 220 cm, na přání i atypické tvary podle šablony. Výroba trvá obvykle 3–4 týdny.' },
        { question: 'Jak dlouho trvá doručení?', answer: 'Zboží skladem odesíláme do 24 h, vlastní dopravou doručujeme do 5 pracovních dnů. Termín vám předem potvrdí řidič telefonicky.' },
        { question: 'Odvezete starou matraci?', answer: 'Při doručení vlastní dopravou starou matraci odvezeme k ekologické likvidaci za poplatek 390 Kč. Stačí to uvést v poznámce k objednávce.' }
      ]
    };
  }
}
</script>
</body>
</html>

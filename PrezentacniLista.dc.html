<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
.ss-pl,.ss-pl *{box-sizing:border-box;}
.ss-pl-wrap{position:fixed;left:16px;bottom:16px;z-index:950;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px;max-width:min(420px,calc(100vw - 32px));font-family:Roboto,Helvetica,Arial,sans-serif;}
.ss-pl{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:100%;padding:12px;border-radius:12px;background:#24496B;border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(8,20,32,.45),0 2px 8px rgba(8,20,32,.3);max-height:calc(100vh - 96px);overflow-y:auto;}
.ss-pl-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.ss-pl-lbl{flex:0 0 64px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8DB3D3;}
.ss-pl-handle{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;flex:none;padding:0 14px;border:0;border-radius:999px;background:rgba(19,44,67,.96);color:#FFFFFF;font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;cursor:pointer;box-shadow:0 16px 40px rgba(19,44,67,.18);transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-pl-handle:hover{background:#1C3D5A;}
.ss-pl-handle:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(251,178,85,.6);}
.ss-pl-btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.12);color:#FFFFFF;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-pl-btn:hover{background:rgba(255,255,255,.22);}
.ss-pl-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(251,178,85,.6);}
.ss-pl-btn[aria-pressed="true"]{background:#FBB255;color:#1C2229;}
.ss-pl-dot{width:8px;height:8px;border-radius:999px;flex:none;}
</style>
</helmet>
<sc-if value="{{ visible }}" hint-placeholder-val="{{ true }}">
<div class="ss-pl-wrap">
  <span style="display:flex;align-items:center;gap:4px;flex:none">
    <button type="button" class="ss-pl-handle" onClick="{{ toggleOpen }}" aria-expanded="{{ expanded }}" aria-label="{{ handleAria }}">
      <span>{{ handleLabel }}</span>
    </button>
    <button type="button" class="ss-pl-handle" style="padding:0;width:44px" onClick="{{ hideAll }}" aria-label="Zavřít prezentační lištu do konce relace">
      <span style="font-size:18px;line-height:1">×</span>
    </button>
  </span>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div class="ss-pl" role="group" aria-label="Prezentační lišta">
    <div class="ss-pl-row">
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="1">
        <button type="button" class="ss-pl-btn" onClick="{{ i.onToggle }}" aria-pressed="{{ i.pressed }}">
          <span class="ss-pl-dot" style="background:{{ i.dot }}"></span>
          <span>{{ i.label }}</span>
        </button>
      </sc-for>
    </div>
    <sc-for list="{{ choices }}" as="c" hint-placeholder-count="3">
      <div class="ss-pl-row">
        <span class="ss-pl-lbl">{{ c.label }}</span>
        <sc-for list="{{ c.options }}" as="o" hint-placeholder-count="2">
          <button type="button" class="ss-pl-btn" onClick="{{ o.onPick }}" aria-pressed="{{ o.pressed }}">
            <span>{{ o.label }}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </div>
  </sc-if>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:260},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label: string, value: boolean}[]&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(index: number) =&gt; void&quot;},&quot;choices&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label: string, value: string, options: string[]}[]&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(index: number, option: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = {
    open: false, hidden: false,
    mode: (() => { try { return localStorage.getItem('ss-mode') === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; } })(),
    bg: (() => { try { return localStorage.getItem('ss-bg') || 'on'; } catch (e) { return 'on'; } })(),
    logo: (() => { try { return localStorage.getItem('ss-logo') || 'a'; } catch (e) { return 'a'; } })()
  };
  setAttr(key, attr, v) {
    try { localStorage.setItem(key, v); } catch (e) {}
    document.documentElement.setAttribute(attr, v);
  }
  setLogo(l) { this.setAttr('ss-logo', 'data-logo', l); this.setState({ logo: l }); }
  setMode(m) {
    try { localStorage.setItem('ss-mode', m); } catch (e) {}
    if (m === 'dark') document.documentElement.setAttribute('data-mode', 'dark'); else document.documentElement.removeAttribute('data-mode');
    this.setState({ mode: m });
  }
  renderVals() {
    const p = this.props;
    const open = this.state.open;
    const src = p.items || [{ label: 'LED u otevírací doby', value: true }];
    const grp = (label, opts, cur, fn) => ({ label, options: opts.map(([l, v]) => ({ label: l, pressed: cur === v ? 'true' : 'false', onPick: () => fn(v) })) });
    const base = [
      grp('Režim', [['Světlý', 'light'], ['Tmavý', 'dark']], this.state.mode, v => this.setMode(v))
    ];
    base.push(grp('Elevace', [['Zap', 'on'], ['Vyp', 'off']], this.state.bg, v => { this.setAttr('ss-bg', 'data-bg', v); this.setState({ bg: v }); }));
    if (this.state.mode === 'dark') base.push(grp('Logo', [['Statické', 'none'], ['A pulz', 'a'], ['D přejezd', 'd']], this.state.logo, v => this.setLogo(v)));
    return {
      open,
      visible: !this.state.hidden,
      hideAll: () => this.setState({ hidden: true }),
      expanded: open ? 'true' : 'false',
      handleLabel: open ? 'Prezentace ×' : 'Prezentace',
      handleAria: open ? 'Skrýt prezentační lištu' : 'Zobrazit prezentační lištu',
      toggleOpen: () => this.setState(s => ({ open: !s.open })),
      items: src.map((it, idx) => ({
        label: it.label + (it.value ? ' zap' : ' vyp'),
        pressed: it.value ? 'true' : 'false',
        dot: it.value ? '#157A41' : '#5B6874',
        onToggle: () => { if (p.onToggle) p.onToggle(idx); }
      })),
      choices: base.concat((p.choices || []).map((ch, ci) => ({
        label: ch.label,
        options: (ch.options || []).map(opt => ({
          label: opt,
          pressed: opt === ch.value ? 'true' : 'false',
          onPick: () => { if (p.onPick) p.onPick(ci, opt); }
        }))
      })))
    };
  }
}
</script>
</body>
</html>

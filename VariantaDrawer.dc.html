<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
.ss-vd-close{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:6px;background:none;color:var(--ss-text-secondary,#3D4750);cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-vd-close:hover{background:var(--ss-hover-bg,#FFF5E6);color:var(--ss-hover-text,#A4600C)}
.ss-vd-close:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-vd-tile{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;cursor:pointer;font-family:inherit;text-align:left;border-radius:12px;}
.ss-vd-tile:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-vd-ph{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--ss-surface-subtle,#FAF5EF);transition:box-shadow .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-vd-tile:hover .ss-vd-ph{box-shadow:inset 0 0 0 2px var(--ss-border-hover,#8DB3D3);}}
.ss-vd-check{position:absolute;top:8px;right:8px;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:#FBB255;color:#1C2229;box-shadow:0 2px 8px rgba(19,44,67,.08);}
.ss-vd-row{display:flex;align-items:flex-start;gap:14px;width:100%;padding:16px 0;border:0;border-bottom:1px dashed var(--ss-border-strong,#C8D0D8);background:none;cursor:pointer;font-family:inherit;text-align:left;}
.ss-vd-row:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
@media (hover:hover) and (pointer:fine){.ss-vd-row:hover .ss-vd-name{color:var(--ss-hover-text,#A4600C);}}
</style>
</helmet>
<sc-if value="{{ mounted }}" hint-placeholder-val="{{ false }}">
  <div class="ss-scrim" style="{{ overlayStyle }}" onClick="{{ close }}" aria-hidden="true"></div>
  <div ref="{{ panelRef }}" role="dialog" aria-modal="true" aria-label="{{ title }}" style="{{ panelStyle }}">
    <div style="display:flex;align-items:center;gap:8px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--ss-border-subtle,#E1E6EB);flex:none">
      <h2 style="margin:0;font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:21px;color:var(--ss-text-heading,#0B1F33)">{{ title }}</h2>
      <button type="button" class="ss-vd-close" style="margin-left:auto" onClick="{{ close }}" aria-label="Zavřít výběr">
        <dc-import name="Ikony" iconName="x" size="22" hint-size="22px,22px"></dc-import>
      </button>
    </div>

    <div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:28px;min-height:0">
      <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
        <p style="margin:0;font-size:14px;line-height:1.6;color:var(--ss-text-secondary,#3D4750)">{{ note }}</p>
      </sc-if>

      <sc-if value="{{ isTiles }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;gap:14px;padding-bottom:4px;border-bottom:1px solid var(--ss-border-subtle,#E1E6EB)">
            <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ false }}">
              <h3 style="margin:0;font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--ss-text-muted,#55616C)">{{ g.title }}</h3>
            </sc-if>
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:20px">
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="6">
                <button type="button" class="ss-vd-tile" onClick="{{ it.onPick }}" aria-pressed="{{ it.pressed }}">
                  <span class="ss-vd-ph" style="background:{{ it.color }};box-shadow:{{ it.ring }}">
                    <sc-if value="{{ it.hasImage }}" hint-placeholder-val="{{ false }}">
                      <img src="{{ it.image }}" alt="" style="display:block;width:100%;height:100%;object-fit:cover" />
                    </sc-if>
                    <sc-if value="{{ it.selected }}" hint-placeholder-val="{{ false }}">
                      <span class="ss-vd-check"><dc-import name="Ikony" iconName="check" size="16" hint-size="16px,16px"></dc-import></span>
                    </sc-if>
                  </span>
                  <span style="font-size:14px;font-weight:{{ it.weight }};color:var(--ss-text-primary,#1C2229);line-height:1.3">{{ it.label }}</span>
                  <sc-if value="{{ it.hasNote }}" hint-placeholder-val="{{ false }}">
                    <span style="font-size:13px;color:{{ it.noteColor }}">{{ it.note }}</span>
                  </sc-if>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </sc-if>

      <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
            <button type="button" class="ss-vd-row" onClick="{{ r.onPick }}" aria-pressed="{{ r.pressed }}">
              <span style="display:flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;border-radius:999px;background:{{ r.dotBg }};color:{{ r.dotColor }};box-shadow:{{ r.dotRing }}">
                <sc-if value="{{ r.selected }}" hint-placeholder-val="{{ false }}">
                  <dc-import name="Ikony" iconName="check" size="16" hint-size="16px,16px"></dc-import>
                </sc-if>
              </span>
              <span style="width:64px;height:48px;flex:none;border-radius:8px;overflow:hidden;background:var(--ss-surface-subtle,#FAF5EF);display:flex;align-items:center;justify-content:center;color:var(--ss-text-decor,#C8D0D8)">
                <sc-if value="{{ r.hasImage }}" hint-placeholder-val="{{ false }}">
                  <img src="{{ r.image }}" alt="" style="display:block;width:100%;height:100%;object-fit:cover" />
                </sc-if>
                <sc-if value="{{ r.noImage }}" hint-placeholder-val="{{ true }}">
                  <dc-import name="Ikony" iconName="photo" size="20" hint-size="20px,20px"></dc-import>
                </sc-if>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
                <span class="ss-vd-name" style="font-size:15px;font-weight:600;color:var(--ss-text-primary,#1C2229);line-height:1.35">{{ r.label }}</span>
                <sc-if value="{{ r.hasMeta }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size:13px;color:var(--ss-text-muted,#5B6874)">{{ r.meta }}</span>
                </sc-if>
                <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:{{ r.stockColor }}">
                  <span style="display:flex;color:{{ r.stockColor }}"><dc-import name="Ikony" iconName="{{ r.stockIcon }}" size="16" hint-size="16px,16px"></dc-import></span>
                  <span>{{ r.stock }}</span>
                </span>
              </span>
              <span style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:17px;color:var(--ss-text-primary,#1C2229);white-space:nowrap">{{ r.price }}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="flex:none;display:flex;gap:12px;padding:16px 20px;border-top:1px solid var(--ss-border-subtle,#E1E6EB);background:var(--ss-surface-page,#FEFAF7)">
      <div style="flex:1;min-width:0"><dc-import name="Tlacitko" label="Hotovo" variant="primary" size="large" fullWidth="{{ true }}" onClick="{{ close }}" hint-size="100%,52px"></dc-import></div>
    </div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:720},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Čalounění&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title?: string, items: {id: string, label: string, note?: string, color?: string, image?: string}[]}[]&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id: string, label: string, meta?: string, price: string, image?: string, stock?: string, outOfStock?: boolean}[]&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { mounted: false, visible: false };
  componentDidMount() {
    this._key = (e) => { if (e.key === 'Escape' && this.props.open) this.close(); };
    this._trap = (e) => {
      if (e.key !== 'Tab' || !this.props.open || !this._panel) return;
      const f = this._panel.querySelectorAll('a[href],button:not([disabled]),input:not([type="hidden"]),select');
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', this._key);
    document.addEventListener('keydown', this._trap);
    if (this.props.open) this.onOpen();
  }
  componentDidUpdate(prev) {
    if (!prev.open && this.props.open) this.onOpen();
    if (prev.open && !this.props.open) this.onClose();
  }
  componentWillUnmount() {
    document.removeEventListener('keydown', this._key);
    document.removeEventListener('keydown', this._trap);
    this.unlock();
    clearTimeout(this._t);
  }
  lock() { if (this._prev === undefined) { this._prev = document.body.style.overflow; document.body.style.overflow = 'hidden'; } }
  unlock() { if (this._prev !== undefined) { document.body.style.overflow = this._prev; this._prev = undefined; } }
  onOpen() {
    this._returnFocus = document.activeElement;
    this.lock();
    this.setState({ mounted: true });
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      this.setState({ visible: true });
      if (this._panel) { const f = this._panel.querySelector('button,a[href],input'); if (f) f.focus(); }
    }, 20);
  }
  onClose() {
    this.unlock();
    this.setState({ visible: false });
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      this.setState({ mounted: false });
      if (this._returnFocus && this._returnFocus.focus) this._returnFocus.focus();
    }, 400);
  }
  close = () => { if (this.props.onClose) this.props.onClose(); };
  renderVals() {
    const p = this.props;
    const visible = this.state.visible;
    const value = p.value;
    const pick = (id) => () => { if (p.onPick) p.onPick(id); };
    const groups = (p.groups || []).map(g => ({
      title: g.title, hasTitle: !!g.title,
      items: (g.items || []).map(it => {
        const sel = it.id === value;
        return {
          label: it.label, note: it.note, hasNote: !!it.note,
          noteColor: it.note && it.note.indexOf('+') === 0 ? 'var(--ss-text-primary,#1C2229)' : 'var(--ss-status-success,#157A41)',
          color: it.color || '#EFF2F5', image: it.image, hasImage: !!it.image,
          selected: sel, pressed: sel ? 'true' : 'false',
          ring: sel ? 'inset 0 0 0 2px #296093' : 'inset 0 0 0 1px rgba(19,44,67,.10)',
          weight: sel ? '600' : '400',
          onPick: pick(it.id)
        };
      })
    }));
    const rows = (p.rows || []).map(r => {
      const sel = r.id === value;
      return {
        label: r.label, meta: r.meta, hasMeta: !!r.meta, price: r.price,
        image: r.image, hasImage: !!r.image, noImage: !r.image,
        stock: r.stock || 'Skladem',
        stockIcon: r.outOfStock ? 'clock' : 'circle-check',
        stockColor: r.outOfStock ? 'var(--ss-text-muted,#5B6874)' : 'var(--ss-status-success,#157A41)',
        selected: sel, pressed: sel ? 'true' : 'false',
        dotBg: sel ? '#FBB255' : 'transparent',
        dotColor: sel ? '#1C2229' : '#5B6874',
        dotRing: sel ? 'none' : 'inset 0 0 0 1px var(--ss-border-strong,#C8D0D8)',
        onPick: pick(r.id)
      };
    });
    return {
      mounted: this.state.mounted,
      title: p.title || 'Výběr varianty',
      note: p.note, hasNote: !!p.note,
      isTiles: groups.length > 0,
      isList: groups.length === 0,
      groups, rows,
      overlayStyle: {
        position: 'fixed', inset: 0, zIndex: 400, 
        opacity: visible ? 1 : 0, transition: 'opacity .4s cubic-bezier(.22,.61,.36,1)'
      },
      panelStyle: {
        position: 'fixed', top: 0, right: 0, bottom: 0, zIndex: 410,
        width: (typeof document !== 'undefined' && document.documentElement.clientWidth < 420) ? '100%' : 'min(92vw,480px)', background: 'var(--ss-surface-page,#FEFAF7)', display: 'flex', flexDirection: 'column',
        boxShadow: '0 16px 40px rgba(19,44,67,.18)',
        transform: visible ? 'translateX(0)' : 'translateX(100%)',
        transition: 'transform .4s cubic-bezier(.22,.61,.36,1)'
      },
      close: this.close,
      panelRef: (el) => { this._panel = el; }
    };
  }
}

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

.ss-cart{font-family:Roboto,Helvetica,Arial,sans-serif;display:inline-flex;align-items:center;gap:10px;text-decoration:none;border-radius:6px;transition:background-color .12s cubic-bezier(.22,.61,.36,1),box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.ss-cart:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
</style>
</helmet>
<a class="ss-cart" href="{{ href }}" style="{{ wrapStyle }}" style-hover="{{ hoverStyle }}" onClick="{{ handleClick }}" aria-label="{{ ariaLabel }}">
  <span style="display:flex;color:{{ iconColor }}">
    <dc-import name="Ikony" iconName="shopping-bag" size="24" hint-size="24px,24px"></dc-import>
  </span>
  <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
    <span style="{{ badgeStyle }}" aria-hidden="true">{{ count }}</span>
  </sc-if>
  <sc-if value="{{ showText }}" hint-placeholder-val="{{ true }}">
    <span style="display:flex;flex-direction:column;line-height:1.15">
      <sc-if value="{{ showLabel }}" hint-placeholder-val="{{ true }}">
        <span style="{{ labelStyle }}">{{ label }}</span>
      </sc-if>
      <span style="{{ totalStyle }}">{{ total }}</span>
    </span>
  </sc-if>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:80},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2 480 Kč&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onTint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;KosikKrok1.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const count = p.count ?? 2;
    const total = p.total ?? '2 480 Kč';
    const onTint = !!p.onTint;
    const compact = !!p.compact;
    return {
      href: p.href || 'KosikKrok1.dc.html',
      handleClick: (e) => { if (p.onClick) { e.preventDefault(); p.onClick(); } },
      count, total,
      hasItems: count > 0,
      showLabel: false,
      showText: !p.hideTotal,
      label: p.label || 'Košík',
      ariaLabel: 'Košík, ' + count + ' položky, celkem ' + total,
      iconColor: onTint ? '#FFFFFF' : 'var(--ss-link-hover,#21507B)',
      wrapStyle: {
        position: 'relative', height: '44px', padding: p.hideTotal ? '0 10px' : (compact ? '0 12px' : '0 18px 0 14px'),
        background: onTint ? 'rgba(255,255,255,.14)' : 'var(--ss-surface-hover,#F0F5FA)',
        color: onTint ? '#FFFFFF' : 'var(--ss-text-primary,#1C2229)'
      },
      hoverStyle: { background: onTint ? 'rgba(255,255,255,.26)' : 'var(--ss-surface-selected,#DCE8F2)' },
      labelStyle: { fontSize: '12px', fontWeight: 500, color: onTint ? '#DCE8F2' : 'var(--ss-text-muted,#55616C)' },
      totalStyle: { fontFamily: "'Archivo Narrow', Roboto, sans-serif", fontSize: '16px', fontWeight: 700, whiteSpace: 'nowrap' },
      badgeStyle: {
        position: 'absolute', top: '-6px', right: '-6px', width: '20px', height: '20px',
        padding: 0, borderRadius: '999px', background: '#FBB255', color: '#1C2229',
        fontSize: '11px', fontWeight: 700, lineHeight: 1,
        display: 'flex', alignItems: 'center', justifyContent: 'center'
      }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="{{ wrapStyle }}">
  <sc-if value="{{ hasHeading }}" hint-placeholder-val="{{ true }}">
    <h2 style="{{ headingStyle }}">{{ heading }}</h2>
  </sc-if>
  <div style="display:grid;grid-template-columns:{{ gridTemplate }};gap:{{ gap }}">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="5">
      <div style="{{ itemStyle }}">
        <span style="{{ iconWrapStyle }}"><dc-import name="Ikony" iconName="{{ i.icon }}" size="26" hint-size="26px,26px"></dc-import></span>
        <span style="{{ titleStyle }}">{{ i.title }}</span>
        <span style="{{ textStyle }}">{{ i.text }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:240},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;pas&quot;,&quot;options&quot;:[&quot;pas&quot;,&quot;dlazdice&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;svetly&quot;,&quot;options&quot;:[&quot;svetly&quot;,&quot;tmavy&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{icon: string, title: string, text: string}[]&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440 };
  componentDidMount() {
    this._resize = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._resize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._resize); }
  renderVals() {
    const p = this.props;
    const w = this.state.width;
    const dark = p.tone === 'tmavy';
    const tiles = p.variant === 'dlazdice';
    const items = p.items || [
      { icon: 'heart-filled', title: '20 000 spokojených spáčů', text: 'Sny si u nás plní zákazníci od roku 2009' },
      { icon: 'truck', title: 'Doprava zdarma nad 5 000 Kč', text: 'Vynášku do bytu domluvíme předem' },
      { icon: 'clock', title: '23 let na trhu', text: 'Kvalitu materiálů známe od výrobců' },
      { icon: 'ruler-3', title: 'Vlastní výroba na míru', text: 'Postel vyrobíme podle vašeho rozměru' },
      { icon: 'map-pin', title: '5 prodejen po celé ČR', text: 'Přijďte si matraci osobně vyzkoušet' }
    ];
    const cols = w >= 1560 ? Math.min(items.length, 6) : w >= 1150 ? Math.min(items.length, 5) : w >= 820 ? 3 : w >= 550 ? 2 : 1;
    return {
      items,
      hasHeading: !!p.heading,
      heading: p.heading,
      headingStyle: {
        margin: '0 0 24px', fontFamily: "'Archivo Narrow', Archivo, sans-serif", fontWeight: 700,
        fontSize: w < 820 ? '26px' : '34px', lineHeight: 1.15, textAlign: 'center',
        color: dark ? '#FFFFFF' : '#1C2229'
      },
      wrapStyle: {
        fontFamily: 'Archivo, Helvetica, Arial, sans-serif', width: '100%', minWidth: 0, boxSizing: 'border-box',
        background: dark ? '#132C43' : (tiles ? 'transparent' : '#FFFFFF'),
        borderRadius: tiles ? 0 : '12px',
        padding: tiles ? 0 : (w < 820 ? '24px 16px' : '32px')
      },
      gridTemplate: 'repeat(' + cols + ',minmax(0,1fr))',
      gap: tiles ? '20px' : (w < 820 ? '20px' : '24px'),
      itemStyle: {
        display: 'flex', flexDirection: 'column', alignItems: tiles ? 'flex-start' : 'center',
        textAlign: tiles ? 'left' : 'center', gap: '8px', minWidth: 0,
        background: tiles ? (dark ? 'rgba(255,255,255,.08)' : '#F7F9FB') : 'transparent',
        borderRadius: tiles ? '12px' : 0,
        padding: tiles ? '20px' : 0
      },
      iconWrapStyle: {
        display: 'flex', alignItems: 'center', justifyContent: 'center', width: '52px', height: '52px',
        borderRadius: '999px', marginBottom: '4px',
        background: dark ? 'rgba(255,255,255,.12)' : '#F0F5FA',
        color: dark ? '#FBB255' : '#296093'
      },
      titleStyle: { fontFamily: "'Archivo Narrow', Archivo, sans-serif", fontWeight: 700, fontSize: '17px', lineHeight: 1.25, color: dark ? '#FFFFFF' : '#1C2229' },
      textStyle: { fontSize: '14px', lineHeight: 1.5, color: dark ? '#DCE8F2' : '#3D4750' }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')!=='light')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h',localStorage.getItem('ss-font-h')||'alt');d.setAttribute('data-font-b',localStorage.getItem('ss-font-b')||'alt');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>@keyframes ssUspTint{0%,25%{color:var(--ss-usp-from)}45%,75%{color:var(--ss-usp-to)}95%,100%{color:var(--ss-usp-from)}}@media (prefers-reduced-motion:reduce){.ss-usp-ic{animation:none!important}}</style>
</helmet>
<div style="{{ wrapStyle }}">
  <sc-if value="{{ hasHeading }}" hint-placeholder-val="{{ true }}">
    <h2 style="{{ headingStyle }}">{{ heading }}</h2>
  </sc-if>
  <div style="display:grid;grid-template-columns:{{ gridTemplate }};gap:{{ gap }}">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="5">
      <div style="{{ itemStyle }}">
        <span class="ss-usp-ic" style="{{ i.iconStyle }}"><dc-import name="Ikony" iconName="{{ i.icon }}" size="60" strokeWidth="{{ i.stroke }}" hint-size="60px,60px"></dc-import></span>
        <span style="{{ titleStyle }}" style-hover="text-decoration:underline;text-underline-offset:3px;cursor:pointer"><span style="{{ hlStyle }}">{{ i.hl }}</span>{{ i.rest }}</span>
        <span style="{{ textStyle }}">{{ i.text }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:240},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;pas&quot;,&quot;options&quot;:[&quot;pas&quot;,&quot;dlazdice&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;svetly&quot;,&quot;options&quot;:[&quot;svetly&quot;,&quot;tmavy&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{icon: string, title: string, text: string}[]&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440 };
  componentDidMount() {
    this._resize = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._resize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._resize); }
  renderVals() {
    const p = this.props;
    const w = this.state.width;
    const dark = p.tone === 'tmavy';
    const tiles = p.variant === 'dlazdice';
    const src = p.items || [
      { icon: 'usp-spanek', title: '20 000 spokojených spáčů', text: 'Sny si u nás plní zákazníci od roku 2009' },
      { icon: 'usp-doprava', title: 'Doprava zdarma nad 5 000 Kč', text: 'Vynášku do bytu domluvíme předem' },
      { icon: 'usp-23-let', title: '23 let na trhu', text: 'Kvalitu materiálů známe od výrobců' },
      { icon: 'usp-vyroba', title: 'Vlastní výroba na míru', text: 'Postel vyrobíme podle vašeho rozměru' },
      { icon: 'usp-prodejny', title: '5 prodejen po celé ČR', text: 'Přijďte si matraci osobně vyzkoušet' }
    ];
    const iconWrap = {
      display: 'flex', alignItems: 'center', justifyContent: 'center', width: '64px', height: '64px', '--ss-icon-knock': tiles ? (dark ? '#24394D' : 'var(--ss-surface-subtle,#F7F9FB)') : (dark ? '#132C43' : 'var(--ss-surface-page,#FFFFFF)'),
      marginBottom: '4px',
      '--ss-usp-from': dark ? '#8DB3D3' : 'var(--ss-usp-from-c,#1F5C99)',
      '--ss-usp-to': dark ? '#FBB255' : 'var(--ss-usp-to-c,#EE8A0E)',
      color: 'var(--ss-usp-from)',
      animation: 'ssUspTint 6s cubic-bezier(.22,.61,.36,1) infinite'
    };
    const items = src.map((it, n) => ({ ...it, hl: it.highlight && it.title.startsWith(it.highlight) ? it.highlight : '', rest: it.highlight && it.title.startsWith(it.highlight) ? it.title.slice(it.highlight.length) : it.title, stroke: String(it.icon || '').indexOf('usp-') === 0 ? 2.5 : 0.95, iconStyle: { ...iconWrap, animationDelay: (n * 0.5) + 's' } }));
    const cols = w >= 1560 ? Math.min(items.length, 6) : w >= 1150 ? Math.min(items.length, 5) : w >= 820 ? 3 : w >= 550 ? 2 : 1;
    return {
      items,
      hasHeading: !!p.heading,
      heading: p.heading,
      headingStyle: {
        margin: '0 0 24px', fontFamily: "'Archivo Narrow', Roboto, sans-serif", fontWeight: 700,
        fontSize: w < 820 ? '26px' : '34px', lineHeight: 1.15, textAlign: 'center',
        color: dark ? '#FFFFFF' : 'var(--ss-text-primary,#1C2229)'
      },
      wrapStyle: {
        fontFamily: 'Roboto, Helvetica, Arial, sans-serif', width: '100%', minWidth: 0, boxSizing: 'border-box',
        background: dark ? '#132C43' : 'transparent',
        borderRadius: tiles ? 0 : '12px',
        padding: tiles ? 0 : (w < 820 ? '24px 16px' : '32px')
      },
      gridTemplate: 'repeat(' + cols + ',minmax(0,1fr))',
      gap: tiles ? '20px' : (w < 820 ? '20px' : '24px'),
      itemStyle: {
        display: 'flex', flexDirection: 'column', alignItems: tiles ? 'flex-start' : 'center',
        textAlign: tiles ? 'left' : 'center', gap: '8px', minWidth: 0,
        background: tiles ? (dark ? 'rgba(255,255,255,.08)' : 'var(--ss-surface-subtle,#F7F9FB)') : 'transparent',
        borderRadius: tiles ? '12px' : 0,
        padding: tiles ? '20px' : 0
      },
      hlStyle: { color: dark ? '#FBB255' : 'var(--ss-text-apricot,#A4600C)' },
      titleStyle: { fontFamily: "'Archivo Narrow', Roboto, sans-serif", fontWeight: 700, fontSize: '17px', lineHeight: 1.25, color: dark ? '#FBB255' : 'var(--ss-text-apricot,#A4600C)' },
      textStyle: { fontSize: '14px', lineHeight: 1.5, color: dark ? '#DCE8F2' : 'var(--ss-text-secondary,#3D4750)' }
    };
  }
}
</script>
</body>
</html>

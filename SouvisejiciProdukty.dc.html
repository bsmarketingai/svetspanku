<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Archivo,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:800!important;font-stretch:75%;text-transform:uppercase;letter-spacing:-0.005em;}

.ss-car-wrap{position:relative;width:100%;min-width:0;}
.ss-car{display:flex;align-items:stretch;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:14px;scrollbar-width:none;padding:14px;margin:-14px;}
.ss-car::-webkit-scrollbar{display:none;}
.ss-car > *{scroll-snap-align:start;}
/* výška overlaye = polovina čtvercové fotky karty (procentní padding se počítá ze šířky) */
.ss-car-nav{position:absolute;top:16px;left:0;right:0;height:0;padding-top:calc((100% - 32px) / 2);pointer-events:none;}
@media (min-width:550px){.ss-car-nav{padding-top:calc(((100% - 20px) / 2 - 32px) / 2);}}
@media (min-width:820px){.ss-car-nav{padding-top:calc(((100% - 40px) / 3 - 32px) / 2);}}
@media (min-width:1150px){.ss-car-nav{padding-top:calc(((100% - 60px) / 4 - 32px) / 2);}}
@media (min-width:1560px){.ss-car-nav{padding-top:calc(((100% - 80px) / 5 - 32px) / 2);}}
.ss-car-arrow{position:absolute;bottom:0;transform:translateY(50%);pointer-events:auto;z-index:3;display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:0;border-radius:999px;background:#FFFFFF;color:#21507B;cursor:pointer;box-shadow:0 4px 12px rgba(19,44,67,.12);transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-car-prev{left:-22px;}
.ss-car-next{right:-22px;}
@media (max-width:1149px){.ss-car-prev{left:-16px;}.ss-car-next{right:-16px;}}
.ss-car-arrow:hover{background:#F0F5FA;}
.ss-car-arrow > *{display:flex;align-items:center;justify-content:center;line-height:0;}
.ss-car-arrow svg{display:block;}
.ss-car-arrow:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-car-below{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.ss-car-flat{position:static;transform:none;pointer-events:auto;display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:0;border-radius:999px;background:none;box-shadow:none;color:#1C2229;cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-car-flat:hover{background:#F0F5FA;color:#296093;}}
</style>
</helmet>
<section style="font-family:Archivo,Helvetica,Arial,sans-serif;width:100%;min-width:0;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
    <h2 style="margin:0;font-family:'Archivo Narrow',Archivo,sans-serif;font-weight:700;font-size:{{ headingSize }};line-height:1.15;color:#1C2229">{{ heading }}</h2>
    <sc-if value="{{ hasLink }}" hint-placeholder-val="{{ false }}">
      <a href="{{ linkHref }}" style="font-size:14px;font-weight:600;color:#296093">{{ linkLabel }}</a>
    </sc-if>
  </div>

  <div class="ss-car-wrap">
    <div class="ss-car" ref="{{ trackRef }}">
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="4">
        <div style="{{ cardWrapStyle }}">
          <dc-import name="ProduktovaKarta" product="{{ i }}" hint-size="100%,480px"></dc-import>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ navOverlay }}" hint-placeholder-val="{{ true }}">
      <div class="ss-car-nav">
        <button type="button" class="ss-car-arrow ss-car-prev" onClick="{{ scrollPrev }}" aria-label="Předchozí produkty">
          <dc-import name="Ikony" iconName="chevron-left" size="22" hint-size="22px,22px"></dc-import>
        </button>
        <button type="button" class="ss-car-arrow ss-car-next" onClick="{{ scrollNext }}" aria-label="Další produkty">
          <dc-import name="Ikony" iconName="chevron-right" size="22" hint-size="22px,22px"></dc-import>
        </button>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ navBelow }}" hint-placeholder-val="{{ false }}">
    <div class="ss-car-below">
      <button type="button" class="ss-car-flat" onClick="{{ scrollPrev }}" aria-label="Předchozí produkty">
        <dc-import name="Ikony" iconName="arrow-left" size="24" hint-size="24px,24px"></dc-import>
      </button>
      <button type="button" class="ss-car-flat" onClick="{{ scrollNext }}" aria-label="Další produkty">
        <dc-import name="Ikony" iconName="arrow-right" size="24" hint-size="24px,24px"></dc-import>
      </button>
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:560},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Související produkty&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;navPosition&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;overlay&quot;,&quot;options&quot;:[&quot;overlay&quot;,&quot;below&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;linkLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Product[]&quot;}}">
class Component extends DCLogic {
  state = { items: null, width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440, arrowTop: null };
  componentDidMount() {
    if (!this.props.items) import('./produkty.js').then(m => this.setState({ items: m.PRODUKTY.slice(0, this.props.count || 8) }));
    this._resize = () => { this.setState({ width: document.documentElement.clientWidth }); this.measure(); };
    window.addEventListener('resize', this._resize);
    this.measure();
  }
  componentWillUnmount() { window.removeEventListener('resize', this._resize); }
  measure() {}
  scroll(dir) {
    const el = this._track;
    if (!el) return;
    const card = el.firstElementChild;
    const step = card ? card.getBoundingClientRect().width + 20 : 320;
    el.scrollBy({ left: dir * step * 2, behavior: 'smooth' });
  }
  renderVals() {
    const p = this.props;
    const w = this.state.width;
    const list = p.items || this.state.items || [];
    const perViewRaw = w >= 1560 ? 5 : w >= 1150 ? 4 : w >= 820 ? 3 : w >= 550 ? 2 : 1;
    const perView = list.length ? Math.min(perViewRaw, list.length) : perViewRaw;
    return {
      heading: p.heading || 'Související produkty',
      headingSize: w < 820 ? '26px' : '34px',
      hasLink: !!p.linkLabel,
      linkLabel: p.linkLabel,
      linkHref: p.linkHref || '#',
      items: list,
      navOverlay: (p.navPosition || 'overlay') !== 'below',
      navBelow: p.navPosition === 'below',
      cardWrapStyle: { display: 'flex', flex: 'none', width: 'calc((100% - ' + ((perView - 1) * 20) + 'px) / ' + perView + ')', minWidth: 0 },
      trackRef: (el) => { this._track = el; },
      scrollPrev: () => this.scroll(-1),
      scrollNext: () => this.scroll(1)
    };
  }
}
</script>
</body>
</html>

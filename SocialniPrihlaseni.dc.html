<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
.ss-sp-soc{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:44px;padding:0 16px;border:0;border-radius:6px;font-family:inherit;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1);}
.ss-sp-soc:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-sp-mail{background:var(--ss-surface-page,#FEFAF7);color:var(--ss-text-primary,#1C2229);box-shadow:inset 0 0 0 1px var(--ss-border-subtle,#E1E6EB);}
.ss-sp-mail:hover{background:var(--ss-hover-bg,#F0F5FA);color:var(--ss-hover-text,#21507B);}
.ss-sp-fb{background:#3B5998;color:#FFFFFF;}
.ss-sp-fb:hover{background:#31497D;color:#FFFFFF;}
.ss-sp-gg{background:var(--ss-surface-page,#FEFAF7);color:var(--ss-text-primary,#1C2229);box-shadow:inset 0 0 0 1px var(--ss-border-subtle,#E1E6EB);}
.ss-sp-gg:hover{background:var(--ss-hover-bg,#F0F5FA);color:var(--ss-hover-text,#21507B);}
.ss-sp-sz{background:#CC0000;color:#FFFFFF;}
.ss-sp-sz:hover{background:#A80000;color:#FFFFFF;}
</style>
</helmet>
<section aria-labelledby="ss-sp-h" style="font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1C2229);box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:12px;background:var(--ss-surface-hover,#F0F5FA)">
  <h2 id="ss-sp-h" class="ss-plain" style="margin:0;font-family:Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;line-height:1.4">Přihlaste se nebo se zaregistrujte propojením svého účtu</h2>
  <div style="display:grid;grid-template-columns:{{ cols }};gap:12px">
    <button type="button" class="ss-sp-soc ss-sp-mail" ref="{{ mailRef }}" onClick="{{ openLogin }}" aria-haspopup="dialog">
      <span style="display:flex;color:var(--ss-link,#296093)"><dc-import name="Ikony" iconName="mail" size="22" hint-size="22px,22px"></dc-import></span>
      <span>E-mail</span>
    </button>
    <a class="ss-sp-soc ss-sp-fb" href="#prihlaseni-facebook">
      <span style="display:flex"><dc-import name="Ikony" iconName="brand-facebook" size="22" hint-size="22px,22px"></dc-import></span>
      <span>Facebook</span>
    </a>
    <a class="ss-sp-soc ss-sp-gg" href="#prihlaseni-google">
      <img src="logo-google.svg" alt="" aria-hidden="true" style="display:block;width:22px;height:22px" />
      <span>Google</span>
    </a>
    <a class="ss-sp-soc ss-sp-sz" href="#prihlaseni-seznam">
      <img src="logo-seznam-znak.svg" alt="" aria-hidden="true" style="display:block;width:22px;height:22px;object-fit:contain;filter:brightness(0) invert(1)" />
      <span>Seznam</span>
    </a>
  </div>
  <sc-if value="{{ loginOpen }}" hint-placeholder-val="{{ false }}">
    <div class="ss-scrim" style="position:fixed;inset:0;z-index:500" onClick="{{ closeLogin }}"></div>
    <div ref="{{ loginRef }}" role="dialog" aria-modal="true" aria-label="Přihlášení" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:510;width:min(92vw,420px);max-height:92vh;overflow-y:auto">
      <dc-import name="PrihlaseniModal" onClose="{{ closeLogin }}" hint-size="100%,560px"></dc-import>
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:680,&quot;height&quot;:160}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440, loginOpen: false };
  componentDidMount() {
    this._r = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); this.unbind(); }
  unbind() {
    if (this._key) { document.removeEventListener('keydown', this._key); this._key = null; }
    document.documentElement.style.overflow = '';
  }
  open() {
    document.documentElement.style.overflow = 'hidden';
    this._key = (e) => {
      if (e.key === 'Escape') { this.close(); return; }
      if (e.key === 'Tab' && this._login) {
        const f = [...this._login.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled && el.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', this._key);
    this.setState({ loginOpen: true }, () => setTimeout(() => { if (this._login) { const f = this._login.querySelector('input,button,a[href]'); if (f) f.focus(); } }, 30));
  }
  close() {
    this.unbind();
    this.setState({ loginOpen: false }, () => { if (this._mail) this._mail.focus(); });
  }
  renderVals() {
    return {
      cols: this.state.width >= 550 ? 'repeat(4,minmax(0,1fr))' : this.state.width >= 420 ? 'repeat(2,minmax(0,1fr))' : 'minmax(0,1fr)',
      loginOpen: this.state.loginOpen,
      openLogin: () => this.open(),
      closeLogin: () => this.close(),
      mailRef: (el) => { this._mail = el; },
      loginRef: (el) => { this._login = el; }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Archivo,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:800!important;font-stretch:75%;text-transform:uppercase;letter-spacing:-0.005em;}

.ss-log,.ss-log *{box-sizing:border-box;}
.ss-log{font-family:Archivo,Helvetica,Arial,sans-serif;width:100%;background:#FFFFFF;border-radius:12px;box-shadow:0 16px 40px rgba(19,44,67,.18);color:#1C2229;display:flex;flex-direction:column;gap:16px;padding:24px;}
.ss-log-close{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:6px;background:none;color:#55616C;cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-log-close:hover{background:#F0F5FA;color:#1C2229;}
.ss-log-close:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-log-soc{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 16px;border-radius:6px;font-size:15px;font-weight:600;text-decoration:none;transition:filter .12s cubic-bezier(.22,.61,.36,1),background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-log-soc:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-log-fb{background:#3B5998;color:#FFFFFF;}
.ss-log-fb:hover{background:#31497D;color:#FFFFFF;}
.ss-log-gg{background:#FFFFFF;color:#1C2229;box-shadow:inset 0 0 0 1px #E1E6EB;}
.ss-log-gg:hover{background:#F7F9FB;color:#1C2229;}
.ss-log-sz{background:#CC0000;color:#FFFFFF;}
.ss-log-sz:hover{background:#A80000;color:#FFFFFF;}
.ss-log-ap{background:#1C2229;color:#FFFFFF;}
.ss-log-ap:hover{background:#000000;color:#FFFFFF;}
.ss-log-link{font-size:14px;font-weight:600;color:#1C2229;text-decoration:underline;text-underline-offset:3px;border-radius:4px;}
.ss-log-link:hover{color:#296093;}
.ss-log-link:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
</style>
</helmet>
<div class="ss-log">
  <div style="display:flex;align-items:center;gap:12px">
    <h2 style="margin:0;font-family:'Archivo Narrow',Archivo,sans-serif;font-weight:700;font-size:26px">Přihlásit</h2>
    <button type="button" class="ss-log-close" style="margin-left:auto" onClick="{{ close }}" aria-label="Zavřít přihlášení">
      <dc-import name="Ikony" iconName="x" size="24" hint-size="24px,24px"></dc-import>
    </button>
  </div>

  <form style="display:flex;flex-direction:column;gap:12px" onSubmit="{{ submit }}">
    <dc-import name="Input" label="" ariaLabel="Váš e-mail" type="email" icon="user" placeholder="Váš e-mail…" value="{{ email }}" onChange="{{ onEmail }}" hint-size="100%,44px"></dc-import>
    <dc-import name="Input" label="" ariaLabel="Vaše heslo" type="password" icon="lock" placeholder="Vaše heslo" value="{{ pass }}" onChange="{{ onPass }}" hint-size="100%,44px"></dc-import>
    <dc-import name="Tlacitko" label="Přihlásit se" variant="primary" size="large" fullWidth="{{ true }}" onClick="{{ submitClick }}" hint-size="100%,52px"></dc-import>
    <dc-import name="Checkbox" label="Přihlásit trvale" checked="{{ remember }}" onChange="{{ onRemember }}" hint-size="100%,24px"></dc-import>
  </form>

  <div style="display:flex;flex-direction:column;gap:10px">
    <a class="ss-log-soc ss-log-fb" href="#prihlaseni-facebook">
      <span style="display:flex"><dc-import name="Ikony" iconName="brand-facebook" size="22" hint-size="22px,22px"></dc-import></span>
      <span>Přihlásit se přes Facebook</span>
    </a>
    <a class="ss-log-soc ss-log-gg" href="#prihlaseni-google">
      <img src="logo-google.svg" alt="" aria-hidden="true" style="display:block;width:22px;height:22px" />
      <span>Přihlásit se přes Google</span>
    </a>
    <a class="ss-log-soc ss-log-sz" href="#prihlaseni-seznam">
      <img src="logo-seznam-znak.svg" alt="" aria-hidden="true" style="display:block;width:24px;height:24px;object-fit:contain;filter:brightness(0) invert(1)" />
      <span>Přihlásit se přes Seznam</span>
    </a>
    <a class="ss-log-soc ss-log-ap" href="#prihlaseni-apple">
      <span style="display:flex"><dc-import name="Ikony" iconName="brand-apple-filled" size="22" hint-size="22px,22px"></dc-import></span>
      <span>Přihlásit se přes Apple ID</span>
    </a>
  </div>

  <div style="display:flex;align-items:center;gap:16px;padding-top:4px">
    <a class="ss-log-link" href="#zapomenute-heslo">Nevíte heslo?</a>
    <a class="ss-log-link" style="margin-left:auto" href="Registrace.dc.html">Registrace</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:620},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(email: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { email: '', pass: '', remember: false };
  renderVals() {
    const p = this.props;
    return {
      email: this.state.email,
      pass: this.state.pass,
      remember: this.state.remember,
      onEmail: (v) => this.setState({ email: v }),
      onPass: (v) => this.setState({ pass: v }),
      onRemember: (v) => this.setState({ remember: v }),
      submit: (e) => { e.preventDefault(); if (p.onSubmit) p.onSubmit(this.state.email); },
      submitClick: () => { if (p.onSubmit) p.onSubmit(this.state.email); },
      close: () => { if (p.onClose) p.onClose(); }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')!=='light')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h',localStorage.getItem('ss-font-h')||'alt');d.setAttribute('data-font-b',localStorage.getItem('ss-font-b')||'alt');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

html,body{margin:0;padding:0;}
button > .sc-host,a > .sc-host,label > .sc-host{display:inline-flex;align-items:center;justify-content:center;line-height:0;}
.sc-host:has(> span > svg){display:inline-flex;align-items:center;justify-content:center;line-height:0;}
.sc-host > span > svg{display:block;}
a{color:var(--ss-link,#296093);}a:hover{color:var(--ss-hover-text,#A4600C);}
/* Rozměr postele — postel se natahuje do délky (smyčka 2,4 s) */
.ss-ic-rozmer .s{transform-box:view-box;transform-origin:4px 0;animation:ss-ic-rz-s 2.4s cubic-bezier(.65,0,.35,1) infinite;}
.ss-ic-rozmer .t{animation:ss-ic-rz-t 2.4s cubic-bezier(.65,0,.35,1) infinite;}
@keyframes ss-ic-rz-s{0%,12%,100%{transform:scaleX(.625);}45%,72%{transform:scaleX(1);}}
@keyframes ss-ic-rz-t{0%,12%,100%{transform:translateX(-6px);}45%,72%{transform:none;}}
@media (prefers-reduced-motion:reduce){.ss-ic-rozmer .s,.ss-ic-rozmer .t{animation:none;}}
/* USP ilustrace — smyčka 6 s, pauza mezi cykly; reduced-motion = statický koncový stav */
.ss-usp *{transform-box:fill-box;}
.ss-usp-spanek .z{animation:ss-usp-z 6s cubic-bezier(.22,.61,.36,1) infinite;}
.ss-usp-spanek .z2{animation-delay:.3s;}.ss-usp-spanek .z3{animation-delay:.6s;}
@keyframes ss-usp-z{0%,8%{opacity:0;transform:translateY(4px);}20%,80%{opacity:1;transform:none;}92%,100%{opacity:0;transform:translateY(-3px);}}
.ss-usp-doprava .s{stroke-dasharray:1;animation:ss-usp-s 1.2s linear infinite;}
.ss-usp-doprava .s2{animation-delay:.2s;}.ss-usp-doprava .s3{animation-delay:.4s;}
@keyframes ss-usp-s{0%{stroke-dashoffset:-1;opacity:0;}30%{opacity:1;}100%{stroke-dashoffset:1;opacity:0;}}
.ss-usp-doprava .t{animation:ss-usp-t .6s ease-in-out infinite alternate;}
@keyframes ss-usp-t{from{transform:translateY(0);}to{transform:translateY(-1px);}}
.ss-usp-23-let .t,.ss-usp-23-let .u{transform-box:view-box;}
.ss-usp-23-let .t{transform:translateY(-56px);animation:ss-usp-t23 6s cubic-bezier(.22,.61,.36,1) infinite;}
.ss-usp-23-let .u{transform:translateY(-364px);animation:ss-usp-u23 6s cubic-bezier(.22,.61,.36,1) infinite;}
@keyframes ss-usp-t23{0%{transform:translateY(0);}35%,100%{transform:translateY(-56px);}}
@keyframes ss-usp-u23{0%{transform:translateY(0);}45%,100%{transform:translateY(-364px);}}
.ss-usp-vyroba .b{transform-origin:center;animation:ss-usp-rot 4s linear infinite;}
@keyframes ss-usp-rot{to{transform:rotate(360deg);}}
.ss-usp-vyroba .d{animation:ss-usp-d 1.2s ease-out infinite;}
.ss-usp-vyroba .d2{animation-delay:.4s;}.ss-usp-vyroba .d3{animation-delay:.8s;}
@keyframes ss-usp-d{0%{opacity:0;transform:translate(0,0);}20%{opacity:1;}100%{opacity:0;transform:translate(-10px,-6px);}}
.ss-usp-prodejny .o{transform-origin:center;}
.ss-usp-prodejny [class*=" p"]{animation:ss-usp-p 6s cubic-bezier(.22,.61,.36,1) infinite;}
.ss-usp-prodejny [class*=" r"]{opacity:0;animation:ss-usp-r 6s ease-out infinite;}
.ss-usp-prodejny .p1,.ss-usp-prodejny .r1{animation-delay:.25s;}.ss-usp-prodejny .p2,.ss-usp-prodejny .r2{animation-delay:.5s;}.ss-usp-prodejny .p3,.ss-usp-prodejny .r3{animation-delay:.75s;}.ss-usp-prodejny .p4,.ss-usp-prodejny .r4{animation-delay:1s;}
@keyframes ss-usp-p{0%{opacity:0;transform:scale(0);}8%{opacity:1;transform:scale(1.3);}14%,100%{opacity:1;transform:scale(1);}}
@keyframes ss-usp-r{0%,8%{opacity:0;transform:scale(1);}10%{opacity:.8;}40%,100%{opacity:0;transform:scale(3.5);}}
@media (prefers-reduced-motion:reduce){.ss-usp *{animation:none!important;}}
</style>
</helmet>
<sc-if value="{{ single }}" hint-placeholder-val="{{ false }}">
  <span style="display:inline-flex;line-height:0">{{ icon }}</span>
</sc-if>
<sc-if value="{{ catalog }}" hint-placeholder-val="{{ true }}">
  <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1c2733);background:#fff;padding:32px;width:100%;box-sizing:border-box">
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;border-bottom:1px solid var(--ss-border-subtle,#e4e8ec);padding-bottom:16px;margin-bottom:24px">
      <h2 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-0.01em">Registr ikon</h2>
      <p style="margin:0;font-size:14px;color:var(--ss-text-muted,#5b6b7c)">Tabler · 24 × 24 · stroke-width 2 · currentColor · bez výplní</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin-bottom:28px;font-size:13px;color:var(--ss-text-muted,#5b6b7c)">
      <span style="display:inline-flex;align-items:center;gap:8px"><span style="color:var(--ss-link,#296093)">{{ swatchBlue }}</span>#296093</span>
      <span style="display:inline-flex;align-items:center;gap:8px"><span style="color:#FBB255">{{ swatchApricot }}</span>#FBB255</span>
      <span>{{ count }} ikon v sadě</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:4px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="12">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px;border-radius:8px;background:#fff" style-hover="background:var(--ss-surface-subtle,#f4f7fa)">
          <span style="color:var(--ss-text-primary,#1c2733);line-height:0">{{ it.el }}</span>
          <code style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ss-text-muted,#5b6b7c);text-align:center;word-break:break-all">{{ it.name }}</code>
        </div>
      </sc-for>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:720},&quot;iconName&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;arrows-diff&quot;,&quot;arrows-exchange&quot;,&quot;arrows-maximize&quot;,&quot;arrows-minimize&quot;,&quot;book&quot;,&quot;book-2&quot;,&quot;calendar-time&quot;,&quot;circle-check&quot;,&quot;clock&quot;,&quot;coin&quot;,&quot;coins&quot;,&quot;color-swatch&quot;,&quot;copy&quot;,&quot;dimensions&quot;,&quot;discount&quot;,&quot;download&quot;,&quot;edit&quot;,&quot;heart-filled&quot;,&quot;loader&quot;,&quot;loader-2&quot;,&quot;loader-3&quot;,&quot;loader-4&quot;,&quot;loader-quarter&quot;,&quot;package&quot;,&quot;palette&quot;,&quot;percentage-0&quot;,&quot;percentage-25&quot;,&quot;percentage-50&quot;,&quot;percentage-75&quot;,&quot;percentage-100&quot;,&quot;phone&quot;,&quot;photo&quot;,&quot;photo-off&quot;,&quot;player-pause&quot;,&quot;player-play&quot;,&quot;player-stop&quot;,&quot;refresh&quot;,&quot;ruler-2&quot;,&quot;ruler-3&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ikona&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;min&quot;:12,&quot;max&quot;:64,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ikona&quot;},&quot;strokeWidth&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:2.5,&quot;step&quot;:0.25,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ikona&quot;}}">
class Component extends DCLogic {
  state = { icons: null };
  componentDidMount() {
    import('./icons.js').then(m => this.setState({ icons: m.ICONS, usp: m.ICONS_USP || {} }));
  }
  svg(name, size, stroke) {
    const icons = this.state.icons;
    const usp = name && name.indexOf('usp-') === 0;
    const src = usp ? this.state.usp : icons;
    if (!src || !src[name]) return null;
    if (usp) return React.createElement('svg', {
      key: name, width: size, height: size, viewBox: ({ 'usp-doprava': '-1.5 0.25 64 64', 'usp-vyroba': '0 -0.7 64 64' })[name] || '0 0 64 64', fill: 'none', className: 'ss-usp ss-' + name,
      stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round',
      'aria-hidden': true, focusable: 'false', style: { display: 'block', overflow: 'hidden' },
      dangerouslySetInnerHTML: { __html: src[name] }
    });
    return React.createElement('svg', {
      key: name, width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
      stroke: 'currentColor', strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round',
      'aria-hidden': true, focusable: 'false', style: { display: 'block' },
      dangerouslySetInnerHTML: { __html: icons[name] }
    });
  }
  renderVals() {
    const name = this.props.iconName;
    const size = this.props.size ?? 24;
    const stroke = this.props.strokeWidth ?? 2;
    const icons = this.state.icons || {};
    const names = Object.keys(icons).sort();
    return {
      single: !!name,
      catalog: !name,
      icon: name ? this.svg(name, size, stroke) : null,
      count: names.length,
      swatchBlue: this.svg('color-swatch', 18, 2),
      swatchApricot: this.svg('palette', 18, 2),
      items: names.map(n => ({ name: n, el: this.svg(n, 24, stroke) }))
    };
  }
}
</script>
</body>
</html>

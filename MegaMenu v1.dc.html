<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Archivo,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:800!important;font-stretch:75%;text-transform:uppercase;letter-spacing:-0.005em;}

.ss-mm a{text-decoration:none;}
.ss-mm-link{font-family:Archivo,Helvetica,Arial,sans-serif;display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;margin:0 -8px;border-radius:6px;color:#3D4750;font-size:15px;transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1);}
.ss-mm-link:hover{background:#F7F9FB;color:#296093;}
.ss-mm-link:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-mm-all{font-family:Archivo,Helvetica,Arial,sans-serif;display:inline-flex;align-items:center;gap:6px;color:#296093;font-size:14px;font-weight:600;border-radius:4px;}
.ss-mm-all:hover{color:#21507B;text-decoration:underline;text-underline-offset:3px;}
.ss-mm-all:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
</style>
</helmet>
<div class="ss-mm" style="width:100%;background:#FFFFFF;box-shadow:0 16px 40px rgba(19,44,67,.18);border-radius:0 0 12px 12px;font-family:Archivo,Helvetica,Arial,sans-serif">
  <div style="max-width:1560px;margin:0 auto;padding:32px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:start">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:32px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
          <h3 style="margin:0;font-family:'Archivo Narrow',Archivo,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#55616C">{{ g.title }}</h3>
          <div style="display:flex;flex-direction:column;gap:2px">
            <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="4">
              <a class="ss-mm-link" href="{{ i.href }}">
                <span style="width:40px;height:40px;border-radius:6px;background:#EFF2F5;flex:none;display:flex;align-items:center;justify-content:center;color:#9AA6B2"><dc-import name="Ikony" iconName="photo" size="18" hint-size="18px,18px"></dc-import></span>
                <span style="min-width:0">{{ i.label }}</span>
                <span style="margin-left:auto;font-size:13px;color:#5B6874">{{ i.count }}</span>
              </a>
            </sc-for>
          </div>
          <a class="ss-mm-all" href="{{ g.allHref }}">{{ g.allLabel }}<dc-import name="Ikony" iconName="chevron-right" size="16" hint-size="16px,16px"></dc-import></a>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:24px;min-width:0">
      <sc-if value="{{ hasPopular }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <h3 style="margin:0;font-family:'Archivo Narrow',Archivo,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#55616C">Nejhledanější</h3>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ popular }}" as="c" hint-placeholder-count="4">
              <dc-import name="Chip" label="{{ c.label }}" variant="outline" size="small" href="{{ c.href }}" hint-size="120px,32px"></dc-import>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ hasPromo }}" hint-placeholder-val="{{ true }}">
        <div style="background:#F0F5FA;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px">
          <div style="height:120px;border-radius:8px;background:#DCE8F2;display:flex;align-items:center;justify-content:center;color:#5B8FBC"><dc-import name="Ikony" iconName="photo" size="28" hint-size="28px,28px"></dc-import></div>
          <h4 style="margin:0;font-family:'Archivo Narrow',Archivo,sans-serif;font-weight:700;font-size:19px;color:#1C2229">{{ promoTitle }}</h4>
          <p style="margin:0;font-size:14px;color:#3D4750;line-height:1.5">{{ promoText }}</p>
          <div><dc-import name="Tlacitko" label="{{ promoCta }}" href="{{ promoHref }}" variant="primary" size="standard" iconRight="chevron-right" hint-size="180px,36px"></dc-import></div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420},&quot;category&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;MenuCategory&quot;},&quot;maxItems&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:3,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { demo: null };
  componentDidMount() {
    if (!this.props.category) import('./menu.js').then(m => this.setState({ demo: m.MENU[1] }));
  }
  renderVals() {
    const cat = this.props.category || this.state.demo || {};
    const max = this.props.maxItems ?? 5;
    const groups = (cat.groups || []).map(g => ({
      title: g.title,
      items: (g.items || []).slice(0, max),
      allHref: cat.href || '#',
      allLabel: 'Zobrazit vše (' + (g.total ?? (g.items || []).length) + ')'
    }));
    const popular = (cat.popular || []).map(label => ({ label, href: '#' }));
    const promo = cat.promo;
    return {
      groups, popular,
      hasPopular: popular.length > 0,
      hasPromo: !!promo,
      promoTitle: promo && promo.title,
      promoText: promo && promo.text,
      promoCta: promo && promo.cta,
      promoHref: (promo && promo.href) || '#'
    };
  }
}
</script>
</body>
</html>

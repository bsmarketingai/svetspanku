<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tmavy-rezim.css">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,'Archivo Narrow',Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}

.ss-var{display:flex;align-items:center;gap:10px;border:0;background:var(--ss-surface-page,#FFFFFF);font:inherit;font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1C2229);cursor:pointer;border-radius:6px;box-shadow:inset 0 0 0 1px var(--ss-border-strong,#C8D0D8);transition:box-shadow .15s cubic-bezier(.22,.61,.36,1),background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-var:hover{box-shadow:inset 0 0 0 1px var(--ss-border-hover,#8DB3D3);}
.ss-var:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35),inset 0 0 0 1px var(--ss-border-action,#296093);}
.ss-var[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ss-border-action,#296093);background:var(--ss-surface-hover,#F0F5FA);}
.ss-var[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
</style>
</helmet>
<div style="font-family:Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;gap:10px;width:100%;min-width:0">
  <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px">
    <span style="font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ss-text-muted,#55616C)">{{ title }}</span>
    <sc-if value="{{ hasSelectedLabel }}" hint-placeholder-val="{{ true }}">
      <span style="font-size:14px;font-weight:600;color:var(--ss-text-primary,#1C2229)">{{ selectedLabel }}</span>
    </sc-if>
    <sc-if value="{{ hasHelp }}" hint-placeholder-val="{{ false }}">
      <a href="{{ helpHref }}" style="margin-left:auto;font-size:13px;color:var(--ss-link,#296093)">{{ helpLabel }}</a>
    </sc-if>
  </div>

  <sc-if value="{{ isCards }}" hint-placeholder-val="{{ true }}">
    <div role="radiogroup" aria-label="{{ title }}" style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
        <button type="button" class="ss-var" style="min-height:52px;padding:8px 16px;flex-direction:column;align-items:flex-start;gap:2px" role="radio" aria-checked="{{ o.checked }}" aria-disabled="{{ o.disabled }}" onClick="{{ o.onPick }}">
          <span style="font-family:'Archivo Narrow',Roboto,sans-serif;font-weight:700;font-size:16px">{{ o.label }}</span>
          <sc-if value="{{ o.hasNote }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:12px;color:var(--ss-text-muted,#5B6874)">{{ o.note }}</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isRows }}" hint-placeholder-val="{{ false }}">
    <div role="radiogroup" aria-label="{{ title }}" style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
        <button type="button" class="ss-var" style="width:100%;min-height:48px;padding:8px 16px" role="radio" aria-checked="{{ o.checked }}" aria-disabled="{{ o.disabled }}" onClick="{{ o.onPick }}">
          <span style="flex:1;min-width:0;text-align:left;font-size:15px;font-weight:500">{{ o.label }}</span>
          <sc-if value="{{ o.hasNote }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:13px;color:var(--ss-text-muted,#5B6874)">{{ o.note }}</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isSelect }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Select" variant="outline" ariaLabel="{{ title }}" value="{{ value }}" options="{{ selectOptions }}" onChange="{{ onSelect }}" fullWidth="{{ true }}" hint-size="100%,44px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:180},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rozměr&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;karty&quot;,&quot;options&quot;:[&quot;karty&quot;,&quot;radky&quot;,&quot;select&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;helpLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id: string, label: string, note?: string, disabled?: boolean}[]&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const layout = p.layout || 'karty';
    const raw = p.options && p.options.length ? p.options : [
      { id: '90x200', label: '90 × 200', note: '7 590 Kč' },
      { id: '140x200', label: '140 × 200', note: '9 190 Kč' },
      { id: '160x200', label: '160 × 200', note: '10 490 Kč' },
      { id: '180x200', label: '180 × 200', note: '11 290 Kč' },
      { id: '200x200', label: '200 × 200', note: 'na objednávku', disabled: true }
    ];
    const value = p.value ?? raw[0].id;
    const sel = raw.filter(o => o.id === value)[0];
    return {
      title: p.title || 'Rozměr',
      hasSelectedLabel: !!sel,
      selectedLabel: sel ? sel.label : '',
      hasHelp: !!p.helpLabel,
      helpLabel: p.helpLabel,
      helpHref: p.helpHref || '#poradna',
      isCards: layout === 'karty',
      isRows: layout === 'radky',
      isSelect: layout === 'select',
      value,
      selectOptions: raw.map(o => ({ value: o.id, label: o.note ? o.label + ' — ' + o.note : o.label })),
      onSelect: (v) => { if (p.onPick) p.onPick(v); },
      options: raw.map(o => ({
        label: o.label,
        note: o.note,
        hasNote: !!o.note,
        checked: o.id === value ? 'true' : 'false',
        disabled: o.disabled ? 'true' : undefined,
        onPick: () => { if (!o.disabled && p.onPick) p.onPick(o.id); }
      }))
    };
  }
}
</script>
</body>
</html>
